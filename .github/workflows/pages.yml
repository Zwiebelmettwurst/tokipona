name: Seite veröffentlichen

# Baut den Prototyp aus prototype/ neu und stellt docs/ auf GitHub Pages.
# Läuft auch auf dem Arbeitszweig, damit sich die Fassung vor dem Zusammenführen
# auf dem Telefon testen lässt.
on:
  push:
    branches:
      - main
      - claude/toki-pona-ios-app-n4bg0v
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Ein Lauf nach dem anderen; laufende Veröffentlichungen nicht abbrechen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prototyp bauen
        run: |
          python3 prototype/make_icons.py
          python3 prototype/build.py

      - name: Parser gegen die Korpora prüfen
        run: node prototype/test.js

      - name: Auf Abweichung zum eingecheckten Stand prüfen
        run: |
          if ! git diff --quiet -- docs/; then
            echo "::warning::docs/ weicht vom Bauergebnis ab — bitte neu bauen und einchecken:"
            git diff --stat -- docs/
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
