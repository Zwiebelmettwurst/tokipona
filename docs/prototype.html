<script>
// Zeilennaher Port von TokiPonaKit für den Prototyp.
// Maßgeblich bleibt das Swift-Paket; prototype/test.js prüft beide gegen
// dieselben Korpora.

const TokiPona = (function (data) {
  const LEX = data.lexicon;
  const VARIANTS = data.variants;

  const PREPOSITIONS = new Set(['lon', 'tan', 'tawa', 'kepeken', 'sama']);
  const PREVERBS = new Set(['wile', 'ken', 'kama', 'awen', 'sona', 'lukin']);
  const EXT_PREVERBS = new Set(['alasa', 'open', 'pini']);
  const STRUCTURAL = new Set(['li', 'e', 'la', 'pi', 'o', 'en', 'anu', 'a']);
  const BOUNDARY = new Set(['li', 'e', 'la', 'o', 'en', 'anu']);

  const VOWELS = new Set(['a', 'e', 'i', 'o', 'u']);
  const CONSONANTS = new Set(['j', 'k', 'l', 'm', 'n', 'p', 's', 't', 'w']);
  const FORBIDDEN = new Set(['ji', 'ti', 'wo', 'wu']);
  const STRIPPED = new Set([...'.,;!?"\'„“»«()[]…·-–—']);

  const lookup = (text) => LEX[VARIANTS[text] || text] || null;

  // ---------------------------------------------------------------- Lautregeln

  function phonoCheck(text) {
    const lower = text.toLowerCase();
    if (!lower) return { kind: 'emptyString', detail: '' };
    for (const c of lower) {
      if (!VOWELS.has(c) && !CONSONANTS.has(c)) return { kind: 'foreignLetter', detail: c };
    }
    const chars = [...lower];
    let i = 0, first = true;
    while (i < chars.length) {
      let syllable = '';
      if (CONSONANTS.has(chars[i])) { syllable += chars[i]; i += 1; }
      else if (!first) return { kind: 'missingVowel', detail: '' };
      if (i >= chars.length || !VOWELS.has(chars[i])) {
        return { kind: syllable ? 'danglingConsonant' : 'missingVowel', detail: syllable };
      }
      syllable += chars[i];
      i += 1;
      if (FORBIDDEN.has(syllable)) return { kind: 'forbiddenSyllable', detail: syllable };
      if (i < chars.length && chars[i] === 'n') {
        const next = i + 1 < chars.length ? chars[i + 1] : null;
        if (next && VOWELS.has(next)) { /* eröffnet die nächste Silbe */ }
        else if (next && (next === 'n' || next === 'm')) {
          return { kind: 'forbiddenSyllable', detail: 'n' + next };
        } else { syllable += 'n'; i += 1; }
      }
      first = false;
    }
    return null;
  }

  const PHONO_MESSAGE = {
    emptyString: () => 'Leere Zeichenkette.',
    foreignLetter: (c) => `„${c}“ gehört nicht zu den 14 Buchstaben von toki pona.`,
    forbiddenSyllable: (s) => `Die Silbe „${s}“ ist in toki pona nicht erlaubt.`,
    missingVowel: () => 'Jede Silbe braucht einen Vokal.',
    danglingConsonant: () => 'Nach dem letzten Vokal ist nur „n“ erlaubt.',
  };

  // ---------------------------------------------------------------- Tokenizer

  function editDistance(a, b) {
    if (!a.length) return b.length;
    if (!b.length) return a.length;
    let prev = [...Array(b.length + 1).keys()];
    for (let i = 1; i <= a.length; i += 1) {
      const cur = [i, ...Array(b.length).fill(0)];
      for (let j = 1; j <= b.length; j += 1) {
        const cost = a[i - 1] === b[j - 1] ? 0 : 1;
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
      }
      prev = cur;
    }
    return prev[b.length];
  }

  const SPELLINGS = [...Object.keys(LEX), ...Object.keys(VARIANTS)].sort();

  function suggest(text) {
    let best = null;
    for (const candidate of SPELLINGS) {
      if (Math.abs(candidate.length - text.length) > 1) continue;
      if (editDistance(text, candidate) === 1) {
        if (best !== null && best.length <= candidate.length) continue;
        best = candidate;
      }
    }
    return best;
  }

  function makeToken(original, index, offset, colon) {
    const token = {
      original, text: original.toLowerCase(), index, offset,
      followedByColon: colon, word: null, kind: null, suggestion: null, problem: null,
    };
    if (/^[A-ZÄÖÜ]/.test(original)) {
      const problem = phonoCheck(token.text);
      if (problem) { token.kind = 'malformedName'; token.problem = problem; }
      else token.kind = 'properName';
    } else if (lookup(token.text)) {
      token.kind = 'known';
      token.word = lookup(token.text);
    } else {
      token.kind = 'unknown';
      token.suggestion = suggest(token.text);
    }
    return token;
  }

  const isParticle = (t, p) => t.text === p && STRUCTURAL.has(p) && t.word !== null;
  const isBoundary = (t) => t.word !== null && BOUNDARY.has(t.text);
  const isProperName = (t) => t.kind === 'properName' || t.kind === 'malformedName';
  const canModify = (t) => (t.kind === 'known'
    ? (!t.word.roles.includes('particle') || t.word.roles.includes('content'))
    : true);

  const isPreverb = (t) => t.word !== null && (PREVERBS.has(t.text) || EXT_PREVERBS.has(t.text));

  function tokenize(input) {
    const tokens = [];
    let raw = '', start = 0;
    const flush = () => {
      if (!raw) return;
      let body = raw, colon = false;
      while (body.endsWith(':')) { colon = true; body = body.slice(0, -1); }
      body = [...body].filter((c) => !STRIPPED.has(c)).join('');
      raw = '';
      if (!body) return;
      tokens.push(makeToken(body, tokens.length, start, colon));
    };
    [...input].forEach((character, position) => {
      if (/\s/.test(character)) flush();
      else { if (!raw) start = position; raw += character; }
    });
    flush();
    return tokens;
  }

  function splitUtterances(input) {
    const out = [];
    let current = '';
    for (const c of input) {
      current += c;
      if ('.!?'.includes(c)) { if (current.trim()) out.push(current.trim()); current = ''; }
    }
    if (current.trim()) out.push(current.trim());
    return out;
  }

  // ---------------------------------------------------------------- Parser

  const CONCEPT_OF_RULE = {
    liAfterMiSina: 'c_mi_sina',
    missingLi: 'c_li', missingSubject: 'c_li', missingPredicate: 'c_li', repeatedParticle: 'c_li',
    objectWithoutNoun: 'c_e_objekt',
    piWithSingleWord: 'c_pi', piWithoutContent: 'c_pi',
    vocativeWithoutContent: 'c_o',
    emptyContext: 'c_la', contextWithoutClause: 'c_la',
    properNameNotTokiponized: 'c_namen', properNameAsHead: 'c_namen',
  };

  class Engine {
    constructor(tokens) {
      this.tokens = tokens;
      this.pos = 0;
      this.limit = tokens.length;
      this.violations = [];
      this.suppress = false;
    }

    report(rule, tokens, message, correction = null) {
      if (this.suppress && (rule === 'unknownWord' || rule === 'properNameNotTokiponized')) return;
      this.violations.push({
        rule, message, correction,
        concept: CONCEPT_OF_RULE[rule] || null,
        tokenIndices: tokens.map((t) => t.index),
      });
    }

    run() {
      if (!this.tokens.length) { this.report('emptyUtterance', [], 'Der Satz ist leer.'); return null; }
      this.reportLexicalIssues();

      let start = 0, end = this.tokens.length;
      const finals = [];
      let question = this.tokens.some((t) => t.text === 'seme' && t.word);

      if (end - start > 1 && this.tokens[start].text === 'taso' && this.tokens[start].word) start += 1;

      let changed = true;
      while (changed) {
        changed = false;
        if (end - start >= 3
            && this.tokens[end - 2].text === 'anu' && this.tokens[end - 2].word
            && this.tokens[end - 1].text === 'seme' && this.tokens[end - 1].word) {
          question = true;
          finals.unshift(this.tokens[end - 2], this.tokens[end - 1]);
          end -= 2; changed = true;
        }
        while (end - start > 1 && this.tokens[end - 1].word
               && (this.tokens[end - 1].text === 'a' || this.tokens[end - 1].text === 'kin')) {
          finals.unshift(this.tokens[end - 1]);
          end -= 1; changed = true;
        }
      }

      const interjection = { contexts: [], clause: { kind: 'interjection', subjects: [], predicates: [] },
                             finalParticles: finals, isQuestion: question };
      if (start >= end) return interjection;
      if (end - start === 1) {
        const word = this.tokens[start].word;
        if (word && word.roles.includes('interjection')) return interjection;
      }

      const contexts = [];
      let segment = start;
      for (;;) {
        const la = this.indexOfTopLevel('la', segment, end);
        if (la === null) break;
        if (la === segment) {
          this.report('emptyContext', [this.tokens[la]], 'Vor „la“ fehlt der Kontext.');
        } else {
          const clause = this.parseClause(segment, la);
          if (clause) {
            if (clause.kind === 'fragment' && clause.subjects.length === 1) {
              contexts.push({ kind: 'phrase', phrase: clause.subjects[0] });
            } else contexts.push({ kind: 'clause', clause });
          }
        }
        segment = la + 1;
      }

      if (segment >= end) {
        this.report('contextWithoutClause', [this.tokens[end - 1]], 'Nach „la“ fehlt der Hauptsatz.');
        return { contexts, clause: null, finalParticles: finals, isQuestion: question };
      }

      const clause = this.parseClause(segment, end);
      if (clause && clause.predicates.some((p) => p.isPolarQuestion)) question = true;
      return { contexts, clause, finalParticles: finals, isQuestion: question };
    }

    reportLexicalIssues() {
      for (const token of this.tokens) {
        if (token.kind === 'unknown') {
          this.report('unknownWord', [token],
            token.suggestion
              ? `„${token.original}“ steht nicht im Wortschatz. Meintest du „${token.suggestion}“?`
              : `„${token.original}“ steht nicht im Wortschatz.`,
            token.suggestion);
        } else if (token.kind === 'malformedName') {
          const message = PHONO_MESSAGE[token.problem.kind](token.problem.detail);
          this.report('properNameNotTokiponized', [token],
            `„${token.original}“ ist kein toki-pona-Name: ${message}`);
        }
      }
    }

    parseClause(from, to) {
      if (from >= to) return null;

      const oIndex = this.indexOfTopLevel('o', from, to);
      if (oIndex !== null) return this.parseDirective(from, oIndex, to);

      const liIndex = this.indexOfTopLevel('li', from, to);

      if (liIndex === from) {
        this.report('missingSubject', [this.tokens[liIndex]], 'Vor „li“ fehlt das Satzsubjekt.');
      }
      if (liIndex === from + 1 && this.isBarePronoun(this.tokens[from])) {
        this.report('liAfterMiSina', [this.tokens[liIndex]],
          `Nach „${this.tokens[from].text}“ als alleinigem Subjekt entfällt „li“.`,
          this.tokens[from].text + ' ' + this.tokens.slice(from + 2, to).map((t) => t.text).join(' '));
      }

      let subjects = [], predicates = [];

      if (liIndex !== null) {
        if (liIndex > from) {
          this.pos = from; this.limit = liIndex;
          subjects = this.parseSubjectChain();
          this.reportLeftovers(liIndex);
        }
        this.pos = liIndex; this.limit = to;
        predicates = this.parsePredicateChain();
      } else if (this.isBarePronoun(this.tokens[from])) {
        this.pos = from; this.limit = Math.min(from + 1, to);
        const subject = this.parseNounPhrase();
        if (subject) subjects = [subject];
        this.pos = from + 1; this.limit = to;
        if (this.pos < to) {
          predicates = [this.parsePredicate(null)];
          predicates = predicates.concat(this.parsePredicateChain());
        }
      } else {
        this.pos = from; this.limit = to;
        subjects = this.parseSubjectChain();
        if (this.pos < to) {
          if (isParticle(this.tokens[this.pos], 'e')) {
            this.report('missingLi', [this.tokens[this.pos]], 'Vor dem Prädikat fehlt „li“.',
              this.correctionWithLi(from, to));
            this.pos = to;
            return { kind: 'declarative', subjects, predicates: [] };
          }
          this.reportLeftovers(to);
        }
        return { kind: 'fragment', subjects, predicates: [] };
      }

      return { kind: 'declarative', subjects, predicates };
    }

    parseDirective(from, oIndex, to) {
      let subjects = [];
      if (oIndex > from) {
        this.pos = from; this.limit = oIndex;
        subjects = this.parseSubjectChain();
        this.reportLeftovers(oIndex);
      }
      const marker = this.tokens[oIndex];
      this.pos = oIndex + 1; this.limit = to;
      let predicates = [];
      if (this.pos < to) {
        predicates.push(this.parsePredicate(marker));
        predicates = predicates.concat(this.parsePredicateChain());
      }
      if (!subjects.length && !predicates.length) {
        this.report('vocativeWithoutContent', [marker],
          '„o“ braucht eine Anrede davor oder einen Befehl danach.');
      }
      return { kind: predicates.length ? 'imperative' : 'vocative', subjects, predicates };
    }

    parseSubjectChain() {
      const phrases = [];
      const first = this.parseNounPhrase(true);
      if (!first) return phrases;
      phrases.push(first);
      while (this.pos < this.limit
             && (isParticle(this.tokens[this.pos], 'en') || isParticle(this.tokens[this.pos], 'anu'))) {
        this.pos += 1;
        const next = this.parseNounPhrase(true);
        if (!next) break;
        phrases.push(next);
      }
      return phrases;
    }

    chainsPredicate(token) {
      return isParticle(token, 'li') || isParticle(token, 'anu');
    }

    parsePredicateChain() {
      const predicates = [];
      while (this.pos < this.limit && this.chainsPredicate(this.tokens[this.pos])) {
        const marker = this.tokens[this.pos];
        this.pos += 1;
        if (this.pos < this.limit && isParticle(this.tokens[this.pos], 'li')) {
          this.report('repeatedParticle', [this.tokens[this.pos]], '„li“ steht doppelt.');
          continue;
        }
        predicates.push(this.parsePredicate(marker));
      }
      return predicates;
    }

    parsePredicate(marker) {
      const preverbs = [];
      let negated = false, polar = false;

      while (this.pos < this.limit && isPreverb(this.tokens[this.pos])) {
        const preverb = this.tokens[this.pos];
        if (this.pos + 1 >= this.limit) break;
        const next = this.tokens[this.pos + 1];
        if (isBoundary(next)) break;
        if (next.text === 'ala' && next.word) {
          if (this.pos + 2 < this.limit && this.tokens[this.pos + 2].text === preverb.text) {
            if (this.pos + 3 >= this.limit || isBoundary(this.tokens[this.pos + 3])) break;
            polar = true;
            preverbs.push({ token: preverb, isNegated: false });
            this.pos += 3;
            continue;
          }
          if (this.pos + 2 < this.limit && !isBoundary(this.tokens[this.pos + 2])) {
            preverbs.push({ token: preverb, isNegated: true });
            negated = true;
            this.pos += 2;
            continue;
          }
          break;
        }
        preverbs.push({ token: preverb, isNegated: false });
        this.pos += 1;
      }

      let core = { kind: 'missing' };
      if (this.pos < this.limit && isPreposition(this.tokens[this.pos])) {
        core = { kind: 'prepositional', phrase: this.parsePrepositionalPhrase() };
      } else if (this.pos < this.limit && !isBoundary(this.tokens[this.pos])) {
        const phrase = this.parseNounPhrase();
        if (phrase) core = { kind: 'phrase', phrase };
      } else {
        this.report('missingPredicate', marker ? [marker] : [],
          marker ? `Nach „${marker.text}“ fehlt das Prädikat.` : 'Dem Satz fehlt das Prädikat.');
      }

      if (core.kind === 'phrase') {
        const mods = core.phrase.modifiers;
        mods.forEach((modifier, offset) => {
          if (modifier.kind !== 'simple' || modifier.token.text !== 'ala' || !modifier.token.word) return;
          const following = mods[offset + 1];
          if (following && following.kind === 'simple'
              && following.token.text === core.phrase.head.text) polar = true;
          else negated = true;
        });
      }

      const objects = [], prepositions = [];
      while (this.pos < this.limit) {
        const token = this.tokens[this.pos];
        if (isParticle(token, 'e')) {
          this.pos += 1;
          if (this.pos < this.limit && isParticle(this.tokens[this.pos], 'e')) {
            this.report('repeatedParticle', [this.tokens[this.pos]], '„e“ steht doppelt.');
            continue;
          }
          const object = this.parseNounPhrase();
          if (object) {
            objects.push(object);
            while (this.pos < this.limit && isParticle(this.tokens[this.pos], 'en')) {
              this.pos += 1;
              const further = this.parseNounPhrase();
              if (!further) break;
              objects.push(further);
            }
          } else {
            this.report('objectWithoutNoun', [token], 'Nach „e“ fehlt das Objekt.');
          }
        } else if (isPreposition(token)) {
          const phrase = this.parsePrepositionalPhrase();
          if (phrase.object === null) {
            if (objects.length) objects[objects.length - 1].modifiers.push({ kind: 'simple', token });
            else if (core.kind === 'phrase') core.phrase.modifiers.push({ kind: 'simple', token });
            else prepositions.push(phrase);
          } else prepositions.push(phrase);
        } else break;
      }

      if (this.pos < this.limit && !this.chainsPredicate(this.tokens[this.pos])) {
        this.report('unexpectedToken', [this.tokens[this.pos]],
          `„${this.tokens[this.pos].original}“ passt an dieser Stelle nicht in den Satzbau.`);
        while (this.pos < this.limit && !this.chainsPredicate(this.tokens[this.pos])) this.pos += 1;
      }

      return { marker, preverbs, core, objects, prepositions, isNegated: negated, isPolarQuestion: polar };
    }

    parsePrepositionalPhrase() {
      const preposition = this.tokens[this.pos];
      this.pos += 1;
      let object = null;
      if (this.pos < this.limit && !isBoundary(this.tokens[this.pos])
          && !isParticle(this.tokens[this.pos], 'pi')) {
        object = this.parseNounPhrase();
      }
      return { preposition, object };
    }

    parseNounPhrase(allowPrepositionAsModifier = false) {
      if (this.pos >= this.limit) return null;
      const head = this.tokens[this.pos];

      if (isBoundary(head) || isParticle(head, 'pi')) {
        this.report('particleInPhrasePosition', [head],
          `„${head.text}“ ist ein Partikel und kann keine Phrase anführen.`);
        return null;
      }
      if (isProperName(head)) {
        this.report('properNameAsHead', [head],
          'Namen stehen als Beifügung hinter einem Wort wie jan, ma oder toki.',
          `jan ${head.original}`);
      }

      this.pos += 1;
      const modifiers = [];
      let embedded = null;

      if (head.followedByColon) {
        embedded = this.parseEmbedded();
        return { head, modifiers, embedded };
      }

      while (this.pos < this.limit) {
        const token = this.tokens[this.pos];

        if (isParticle(token, 'pi')) {
          this.pos += 1;
          const group = [];
          while (this.pos < this.limit && !isBoundary(this.tokens[this.pos])
                 && !isParticle(this.tokens[this.pos], 'pi') && canModify(this.tokens[this.pos])) {
            group.push(this.tokens[this.pos]);
            this.pos += 1;
          }
          if (!group.length) {
            this.report('piWithoutContent', [token], 'Nach „pi“ fehlt die Wortgruppe.');
          } else if (group.length === 1) {
            this.report('piWithSingleWord', [token, group[0]],
              '„pi“ gruppiert nur mehrwortige Beifügungen um; vor einem einzelnen Wort entfällt es.',
              `${head.text} ${group[0].text}`);
            modifiers.push({ kind: 'simple', token: group[0] });
          } else {
            modifiers.push({ kind: 'group', tokens: group });
          }
          continue;
        }

        if (isBoundary(token)) break;
        if (isPreposition(token) && !allowPrepositionAsModifier) break;
        if (!canModify(token)) break;

        modifiers.push({ kind: 'simple', token });
        this.pos += 1;

        if (token.followedByColon) { embedded = this.parseEmbedded(); break; }
      }

      return { head, modifiers, embedded };
    }

    parseEmbedded() {
      if (this.pos >= this.limit) return null;
      const slice = this.tokens.slice(this.pos, this.limit);
      this.pos = this.limit;
      const engine = new Engine(slice);
      engine.suppress = true;
      const utterance = engine.run();
      if (!utterance) return null;
      this.violations = this.violations.concat(engine.violations);
      return utterance;
    }

    indexOfTopLevel(particle, from, to) {
      for (let index = from; index < to; index += 1) {
        if (isParticle(this.tokens[index], particle)) return index;
        if (this.tokens[index].followedByColon) return null;
      }
      return null;
    }

    isBarePronoun(token) {
      return token.word !== null && token.word.roles.includes('pronoun')
        && (token.text === 'mi' || token.text === 'sina');
    }

    reportLeftovers(bound) {
      if (this.pos >= bound) return;
      this.report('unexpectedToken', [this.tokens[this.pos]],
        `„${this.tokens[this.pos].original}“ passt an dieser Stelle nicht in den Satzbau.`);
      this.pos = bound;
    }

    correctionWithLi(from, to) {
      const objectIndex = this.indexOfTopLevel('e', from, to);
      if (objectIndex === null) return null;
      const insertion = Math.max(from + 1, objectIndex - 1);
      const words = this.tokens.slice(from, to).map((t) => t.text);
      words.splice(insertion - from, 0, 'li');
      return words.join(' ');
    }
  }

  function parse(input) {
    const tokens = tokenize(input);
    const engine = new Engine(tokens);
    const utterance = engine.run();
    return { tokens, utterance, violations: engine.violations, isValid: !engine.violations.length };
  }

  // ---------------------------------------------------------------- Satzröntgen

  const phraseTokens = (phrase) => {
    const out = [phrase.head];
    for (const modifier of phrase.modifiers) {
      if (modifier.kind === 'group') out.push(...modifier.tokens);
      else out.push(modifier.token);
    }
    return out;
  };
  const phraseText = (phrase) => phraseTokens(phrase).map((t) => t.text).join(' ');

  function xray(utterance) {
    if (!utterance) return [];
    const spans = [];
    const push = (tokens, role) => spans.push({
      text: tokens.map((t) => t.text).join(' '), role, indices: tokens.map((t) => t.index),
    });

    for (const context of utterance.contexts) {
      if (context.kind === 'phrase') push(phraseTokens(context.phrase), 'Kontext');
      else spans.push(...clauseSpans(context.clause, true));
    }
    if (utterance.clause) spans.push(...clauseSpans(utterance.clause, false));
    for (const particle of utterance.finalParticles) push([particle], 'Partikel');
    return spans;

    function clauseSpans(clause, contextual) {
      const out = [];
      const add = (tokens, role) => out.push({
        text: tokens.map((t) => t.text).join(' '), role, indices: tokens.map((t) => t.index),
      });
      const vocative = clause.kind === 'vocative' || clause.kind === 'imperative';
      for (const subject of clause.subjects) {
        add(phraseTokens(subject), vocative ? 'Anrede' : (contextual ? 'Kontext' : 'Subjekt'));
        if (subject.embedded) out.push(...xray(subject.embedded));
      }
      for (const predicate of clause.predicates) {
        if (predicate.marker) {
          add([predicate.marker], predicate.marker.text === 'o' ? 'Befehl' : 'Prädikat');
        }
        for (const preverb of predicate.preverbs) add([preverb.token], 'Präverb');
        if (predicate.core.kind === 'phrase') {
          add(phraseTokens(predicate.core.phrase), 'Verb');
          if (predicate.core.phrase.embedded) out.push(...xray(predicate.core.phrase.embedded));
        } else if (predicate.core.kind === 'prepositional') {
          add([predicate.core.phrase.preposition], 'Verb');
          if (predicate.core.phrase.object) add(phraseTokens(predicate.core.phrase.object), 'Ergänzung');
        }
        for (const object of predicate.objects) {
          add(phraseTokens(object), 'Objekt');
          if (object.embedded) out.push(...xray(object.embedded));
        }
        for (const prepositional of predicate.prepositions) {
          add([prepositional.preposition], 'Präposition');
          if (prepositional.object) add(phraseTokens(prepositional.object), 'Ergänzung');
        }
      }
      return out;
    }
  }

  return {
    parse, tokenize, splitUtterances, xray, phonoCheck, suggest, editDistance,
    lookup, phraseText, lexicon: LEX,
  };
})(TOKIPONA_DATA);


</script>
<script>
// Prototyp des Übungsflows. Zeigt den Kernkreislauf des Plans:
// bauen statt erkennen, sofortige Rückmeldung mit Satzröntgen, sichtbarer
// Fortschritt — ohne Herzen und ohne Bestenliste.

(function (DATA, TP) {
  const KEY = 'o-toki-fortschritt-v1';
  const GOAL = 40;
  const CONCEPT_LABELS = {
    c_mi_sina: 'mi und sina ohne li',
    c_li: 'li vor dem Prädikat',
    c_modifikator: 'Beifügung folgt dem Kopf',
    c_e_objekt: 'e vor dem Objekt',
    c_pi: 'pi gruppiert um',
    c_la: 'la stellt Kontext voran',
    c_praeposition: 'Präpositionen',
    c_praeverb: 'Präverben',
    c_frage: 'Fragen',
    c_o: 'o für Anrede und Befehl',
    c_namen: 'Namen',
    c_ni: 'ni zeigt auf etwas',
    c_en: 'en verbindet Subjekte',
    c_zahlen: 'Zahlen',
  };

  // Die Kernfertigkeit von toki pona: ausdrücken, wofür es kein Wort gibt.
  // Jede Umschreibung ist beim Bauen durch den Parser gelaufen.
  const COMPOUNDS = [
    { de: 'Auto', tp: 'tomo tawa', literal: 'sich bewegendes Haus' },
    { de: 'Kaffee', tp: 'telo pimeja wawa', literal: 'dunkles starkes Wasser' },
    { de: 'Computer', tp: 'ilo sona', literal: 'Wissens-Gerät' },
    { de: 'Telefon', tp: 'ilo toki', literal: 'Sprech-Gerät' },
    { de: 'Uhr', tp: 'ilo tenpo', literal: 'Zeit-Gerät' },
    { de: 'Fahrrad', tp: 'ilo tawa', literal: 'Bewegungs-Gerät' },
    { de: 'Brille', tp: 'len lukin', literal: 'Seh-Kleidung' },
    { de: 'Bibliothek', tp: 'tomo lipu', literal: 'Dokumenten-Haus' },
    { de: 'Restaurant', tp: 'tomo moku', literal: 'Essens-Haus' },
    { de: 'Schule', tp: 'tomo sona', literal: 'Wissens-Haus' },
    { de: 'Kino', tp: 'tomo pi sitelen tawa', literal: 'Haus der bewegten Bilder' },
    { de: 'Musik', tp: 'kalama musi', literal: 'unterhaltsamer Klang' },
    { de: 'Regen', tp: 'telo tan sewi', literal: 'Wasser von oben' },
    { de: 'Bier', tp: 'telo nasa', literal: 'seltsames Wasser' },
    { de: 'Suppe', tp: 'telo moku', literal: 'Ess-Wasser' },
    { de: 'Arzt', tp: 'jan pi pona sijelo', literal: 'Mensch der Körper-Güte' },
    { de: 'Lehrerin', tp: 'jan pi pana sona', literal: 'Mensch, der Wissen gibt' },
    { de: 'Freund', tp: 'jan pona', literal: 'guter Mensch' },
  ];

  const app = document.getElementById('app');
  const today = () => new Date().toISOString().slice(0, 10);

  const blank = {
    xp: 0, streak: 0, lastDay: null, dayXp: 0, done: {}, mastery: {}, seenWords: {}, srs: {},
  };

  // Lernschritte wie in bewährten Karteikartensystemen: erst zehn Minuten,
  // dann Tage. Der kurze erste Schritt macht die Wiederholung schon in der
  // ersten Sitzung sichtbar, statt sie auf morgen zu vertagen.
  const MINUTE = 60000;
  const DAY = 86400000;
  const STEPS = [10 * MINUTE, DAY, 3 * DAY, 7 * DAY];

  let state = load();
  let session = null;
  let tab = 'pfad';

  function load() {
    try {
      const stored = JSON.parse(localStorage.getItem(KEY));
      return stored ? Object.assign({}, blank, stored) : Object.assign({}, blank);
    } catch (error) {
      return Object.assign({}, blank);
    }
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (error) { /* egal */ }
  }

  function level() { return Math.floor(state.xp / 100) + 1; }
  function levelProgress() { return state.xp % 100; }

  function award(points) {
    const day = today();
    if (state.lastDay !== day) {
      // Schongang: ein verpasster Tag kostet einen Punkt, nicht die ganze Serie.
      const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
      state.streak = state.lastDay === yesterday ? state.streak + 1 : Math.max(1, state.streak - 1);
      state.lastDay = day;
      state.dayXp = 0;
    }
    state.xp += points;
    state.dayXp += points;
    save();
  }

  function schedule(key, correct) {
    const now = Date.now();
    const card = state.srs[key] || { reps: 0, interval: 0, ease: 2.5, due: now };
    if (correct) {
      card.reps += 1;
      if (card.reps <= STEPS.length) card.interval = STEPS[card.reps - 1];
      else card.interval = Math.round(card.interval * card.ease);
      card.ease = Math.min(2.8, card.ease + 0.05);
    } else {
      card.reps = 0;
      card.interval = STEPS[0];
      card.ease = Math.max(1.4, card.ease - 0.2);
    }
    card.due = now + card.interval;
    state.srs[key] = card;
  }

  const dueKeys = () => {
    const now = Date.now();
    return Object.keys(state.srs).filter((key) => state.srs[key].due <= now);
  };

  function taskFromKey(key) {
    const [kind, rest] = [key.slice(0, 1), key.slice(2)];
    if (kind === 'w') {
      const lesson = DATA.lessons.find((l) => l.words.includes(rest)) || DATA.lessons[0];
      return TP.lexicon[rest] ? { type: 'word', word: rest, lesson, concepts: [] } : null;
    }
    if (kind === 'c') {
      const compound = COMPOUNDS[Number(rest)];
      return compound ? { type: 'compound', compound, lesson: DATA.lessons[0], concepts: [] } : null;
    }
    for (const lesson of DATA.lessons) {
      const item = lesson.items.find((i) => i.id === rest);
      if (item) {
        return { type: item.direction === 'de_tp' ? 'build' : 'choose', item, lesson,
                 concepts: lessonConcepts(lesson) };
      }
    }
    return null;
  }

  function keyOf(task) {
    if (task.type === 'word') return 'w:' + task.word;
    if (task.type === 'compound') return 'c:' + COMPOUNDS.indexOf(task.compound);
    if (task.item) return 's:' + task.item.id;
    return null;
  }

  function bumpMastery(concepts, correct) {
    for (const concept of concepts || []) {
      const value = state.mastery[concept] || 0;
      state.mastery[concept] = Math.max(0, Math.min(1, value + (correct ? 0.12 : -0.08)));
    }
  }

  const lessonOf = (number) => DATA.lessons.find((l) => l.number === number);
  const unlocked = (number) => number === DATA.lessons[0].number
    || Boolean(state.done[DATA.lessons[DATA.lessons.findIndex((l) => l.number === number) - 1].number]);

  // ------------------------------------------------------------ Aufgabenbau

  const shuffle = (list) => {
    const out = list.slice();
    for (let i = out.length - 1; i > 0; i -= 1) {
      const j = Math.floor(Math.random() * (i + 1));
      [out[i], out[j]] = [out[j], out[i]];
    }
    return out;
  };

  function buildSession(lesson) {
    const builds = shuffle(lesson.items.filter((i) => i.direction === 'de_tp'));
    const reads = shuffle(lesson.items.filter((i) => i.direction === 'tp_de'));
    const words = shuffle(lesson.words.filter((w) => TP.lexicon[w]));
    const tasks = [];

    words.slice(0, 2).forEach((word) => tasks.push({ type: 'word', word, lesson, concepts: [] }));
    builds.slice(0, 3).forEach((item) =>
      tasks.push({ type: 'build', item, lesson, concepts: lessonConcepts(lesson) }));
    reads.slice(0, 2).forEach((item) =>
      tasks.push({ type: 'choose', item, lesson, concepts: lessonConcepts(lesson) }));

    const flawed = brokenSentence(lesson);
    if (flawed) tasks.push({ type: 'fix', flawed, lesson, concepts: [flawed.violation.concept].filter(Boolean) });

    const compound = availableCompounds(lesson)[0];
    if (compound) tasks.push({ type: 'compound', compound, lesson, concepts: [] });

    if (builds[3]) tasks.push({ type: 'free', item: builds[3], lesson, concepts: lessonConcepts(lesson) });

    return {
      lesson,
      queue: tasks.length ? tasks : builds.slice(0, 4).map((item) => ({ type: 'build', item, lesson, concepts: [] })),
      index: 0,
      correct: 0,
      total: 0,
      xp: 0,
      retried: new Set(),
    };
  }

  function buildReviewSession() {
    const tasks = shuffle(dueKeys()).map(taskFromKey).filter(Boolean).slice(0, 12);
    return {
      lesson: null, review: true, queue: tasks, index: 0, correct: 0, total: 0, xp: 0,
      retried: new Set(),
    };
  }

  // Umschreibungen, deren Wörter die Lernende schon kennt.
  function availableCompounds(lesson) {
    const known = new Set(DATA.lessons.filter((l) => l.number <= lesson.number).flatMap((l) => l.words));
    return shuffle(COMPOUNDS.filter((compound) =>
      TP.tokenize(compound.tp).every((token) => token.text === 'pi' || known.has(token.text))));
  }

  // Fehlersätze entstehen aus richtigen: eine Regel gezielt verletzen und vom
  // Parser bestätigen lassen, dass genau sie anschlägt. Kein Handbetrieb.
  const MUTATIONS = [
    { rule: 'liAfterMiSina', apply: (words) =>
        (['mi', 'sina'].includes(words[0]) && words[1] !== 'li' ? [words[0], 'li', ...words.slice(1)] : null) },
    { rule: 'missingLi', apply: (words) =>
        (words.includes('li') && words.includes('e') && !['mi', 'sina'].includes(words[0])
          ? words.filter((w, i) => i !== words.indexOf('li')) : null) },
    { rule: 'piWithSingleWord', apply: (words) =>
        (words.length > 2 && !words.includes('pi') && !TP.lexicon[words[1]]?.roles.includes('particle')
          ? [words[0], 'pi', ...words.slice(1)] : null) },
  ];

  function brokenSentence(lesson) {
    for (const item of shuffle(lesson.items)) {
      const words = TP.tokenize(item.tp).map((t) => t.text);
      for (const mutation of shuffle(MUTATIONS)) {
        const broken = mutation.apply(words);
        if (!broken) continue;
        const result = TP.parse(broken.join(' ') + '.');
        if (result.violations.length !== 1) continue;
        if (result.violations[0].rule !== mutation.rule) continue;
        return { words: broken, correct: item.tp, violation: result.violations[0] };
      }
    }
    return null;
  }

  function lessonConcepts(lesson) {
    const map = {
      1: ['c_mi_sina', 'c_li'], 2: ['c_modifikator'], 3: ['c_e_objekt'], 4: ['c_e_objekt'],
      5: ['c_ni', 'c_en'], 6: ['c_praeposition'], 7: ['c_frage', 'c_o', 'c_namen'],
      8: ['c_modifikator'], 9: ['c_pi', 'c_la'], 10: ['c_praeverb'], 11: ['c_zahlen'], 12: [],
    };
    return map[lesson.number] || [];
  }

  function distractorWords(lesson, exclude, count) {
    const pool = DATA.lessons
      .filter((l) => l.number <= lesson.number)
      .flatMap((l) => l.words)
      .filter((w) => !exclude.includes(w) && TP.lexicon[w]);
    return shuffle([...new Set(pool)]).slice(0, count);
  }

  // ------------------------------------------------------------ Darstellung

  const el = (html) => {
    const template = document.createElement('template');
    template.innerHTML = html.trim();
    return template.content.firstElementChild;
  };
  const escape = (text) => String(text).replace(/[&<>"]/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function render() {
    app.innerHTML = '';
    if (session) { renderSession(); return; }
    app.append(topbar());
    if (tab === 'pfad') app.append(pathScreen());
    else if (tab === 'nimi') app.append(wordScreen());
    else app.append(sandboxScreen());
    app.append(tabs());
  }

  function topbar() {
    const bar = el(`
      <div>
        <div class="topbar">
          <div class="level"><div class="ring">${level()}</div><span>Stufe</span></div>
          <div class="metric spacer gold"><b>${state.dayXp}</b>/${GOAL} XP heute</div>
          <div class="metric"><b>${state.streak}</b> Tage</div>
        </div>
        <div class="goalbar"><span style="width:${Math.min(100, (state.dayXp / GOAL) * 100)}%"></span></div>
      </div>`);
    return bar;
  }

  function tabs() {
    const bar = el(`
      <nav class="tabs">
        <button data-tab="pfad"><span class="glyph">◈</span>nasin</button>
        <button data-tab="nimi"><span class="glyph">◍</span>nimi</button>
        <button data-tab="toki"><span class="glyph">◐</span>o toki</button>
      </nav>`);
    bar.querySelectorAll('button').forEach((button) => {
      button.dataset.active = button.dataset.tab === tab;
      button.onclick = () => { tab = button.dataset.tab; render(); };
    });
    return bar;
  }

  function pathScreen() {
    const next = DATA.lessons.find((l) => !state.done[l.number]) || DATA.lessons[DATA.lessons.length - 1];
    const screen = el(`
      <div class="screen">
        <div class="hello">
          <h1>o kama pona!</h1>
          <p>${state.xp ? `Weiter bei „${escape(next.title)}“.`
                        : 'Zwölf Lektionen. Du baust Sätze, statt Vokabeln abzuhaken.'}</p>
        </div>
        <div class="path"></div>
      </div>`);

    const due = dueKeys().length;
    if (due) {
      const card = el(`
        <button class="lesson review" data-state="current">
          <span class="badge">↻</span>
          <span class="body">
            <b>${due} ${due === 1 ? 'Karte' : 'Karten'} fällig</b>
            <span>wörter, sätze und umschreibungen von vorher</span>
          </span>
        </button>`);
      card.onclick = () => { session = buildReviewSession(); render(); };
      screen.querySelector('.hello').after(card);
    }

    const path = screen.querySelector('.path');
    DATA.lessons.forEach((lesson) => {
      const open = unlocked(lesson.number);
      const done = Boolean(state.done[lesson.number]);
      const stateName = done ? 'done' : (open ? (lesson.number === next.number ? 'current' : 'open') : 'locked');
      const card = el(`
        <button class="lesson" data-state="${stateName}">
          <span class="badge">${done ? '✓' : lesson.number}</span>
          <span class="body">
            <b>${escape(lesson.title)}</b>
            <span>${lesson.words.slice(0, 5).join(' · ')}</span>
          </span>
          <span class="dots">${lesson.words.map((word) =>
            `<i class="${state.seenWords[word] ? 'on' : ''}"></i>`).join('')}</span>
        </button>`);
      if (open) card.onclick = () => { session = buildSession(lesson); render(); };
      else card.disabled = true;
      path.append(card);
    });

    const active = Object.keys(state.mastery);
    if (active.length) {
      const card = el('<div class="card"><h2>konzepte</h2><div class="concepts"></div></div>');
      const list = card.querySelector('.concepts');
      active.sort((a, b) => state.mastery[b] - state.mastery[a]).forEach((concept) => {
        list.append(el(`
          <div class="concept">
            <span>${escape(CONCEPT_LABELS[concept] || concept)}</span>
            <span class="bar"><i style="width:${Math.round(state.mastery[concept] * 100)}%"></i></span>
          </div>`));
      });
      screen.append(card);
    }

    screen.append(el(`
      <p class="foot">
        Prototyp. Übungssätze aus <a href="https://lipu-sona.pona.la/de/">lipu sona pona</a>
        (MIT, © 2020 /dev/urandom und Mitwirkende), geprüft von TokiPonaKit.
      </p>`));
    return screen;
  }

  // ------------------------------------------------------------ Übungslauf

  function renderSession() {
    if (session.index >= session.queue.length) { renderDone(); return; }
    const task = session.queue[session.index];

    const head = el(`
      <div class="exbar">
        <button aria-label="Abbrechen">✕</button>
        <span class="track"><i style="width:${(session.index / session.queue.length) * 100}%"></i></span>
        <span class="metric">✓ <b>${session.correct}</b></span>
      </div>`);
    head.querySelector('button').onclick = () => { session = null; render(); };
    app.append(head);

    if (task.type === 'word') app.append(wordTask(task));
    else if (task.type === 'build') app.append(buildTask(task));
    else if (task.type === 'choose') app.append(chooseTask(task));
    else if (task.type === 'fix') app.append(fixTask(task));
    else if (task.type === 'compound') app.append(compoundTask(task));
    else app.append(freeTask(task));
  }

  function screenWith(inner) {
    return el(`<div class="screen">${inner}</div>`);
  }

  function wordTask(task) {
    const entry = TP.lexicon[task.word];
    const right = entry.glosses.slice(0, 3).join(', ');
    const options = shuffle([right, ...distractorWords(task.lesson, [task.word], 3)
      .map((w) => TP.lexicon[w].glosses.slice(0, 3).join(', '))]);

    const screen = screenWith(`
      <p class="prompt">was heißt das wort?</p>
      <h2 class="question tp">${escape(task.word)}</h2>
      <div class="choices"></div>
      <div class="actions"><button class="primary" disabled>Prüfen</button></div>`);

    let picked = null;
    const list = screen.querySelector('.choices');
    const button = screen.querySelector('.primary');
    options.forEach((option) => {
      const choice = el(`<button class="choice">${escape(option)}</button>`);
      choice.onclick = () => {
        picked = option;
        list.querySelectorAll('.choice').forEach((c) => { c.dataset.picked = 'false'; });
        choice.dataset.picked = 'true';
        button.disabled = false;
      };
      list.append(choice);
    });

    button.onclick = () => {
      state.seenWords[task.word] = true;
      finish(task, picked === right, {
        solution: `${task.word} — ${right}`,
        xray: null,                     // eine Wortbedeutung hat keinen Satzbau
        reason: picked === right ? null
          : `<b>${escape(task.word)}</b> deckt: ${escape(entry.glosses.join(', '))}.`,
      });
    };
    return screen;
  }

  function chooseTask(task) {
    const right = task.item.de[0];
    const pool = task.lesson.items
      .filter((i) => i.id !== task.item.id)
      .flatMap((i) => i.de)
      .filter((text) => text !== right);
    const options = shuffle([right, ...shuffle(pool).slice(0, 2)]);

    const screen = screenWith(`
      <p class="prompt">was bedeutet der satz?</p>
      <h2 class="question tp">${escape(task.item.tp)}</h2>
      <div class="choices"></div>
      <div class="actions"><button class="primary" disabled>Prüfen</button></div>`);

    let picked = null;
    const list = screen.querySelector('.choices');
    const button = screen.querySelector('.primary');
    options.forEach((option) => {
      const choice = el(`<button class="choice">${escape(option)}</button>`);
      choice.onclick = () => {
        picked = option;
        list.querySelectorAll('.choice').forEach((c) => { c.dataset.picked = 'false'; });
        choice.dataset.picked = 'true';
        button.disabled = false;
      };
      list.append(choice);
    });

    button.onclick = () => finish(task, picked === right, {
      solution: right,
      xray: task.item.tp,
    });
    return screen;
  }

  // Fehlersuche: das falsche Wort antippen. Die Stelle kommt aus dem Parser,
  // nicht aus einer Handliste — deshalb stimmt sie immer.
  function fixTask(task) {
    const screen = screenWith(`
      <p class="prompt">hier stimmt ein wort nicht — tipp es an</p>
      <div class="pickline"></div>
      <p class="hint">Ein Wort steht zu viel oder fehlt an dieser Stelle.</p>
      <div class="actions"><button class="primary" disabled>Prüfen</button></div>`);

    const line = screen.querySelector('.pickline');
    const button = screen.querySelector('.primary');
    let picked = null;

    task.flawed.words.forEach((word, index) => {
      const chip = el(`<button class="tile">${escape(word)}</button>`);
      chip.onclick = () => {
        picked = index;
        line.querySelectorAll('.tile').forEach((t) => t.classList.remove('placed'));
        chip.classList.add('placed');
        button.disabled = false;
      };
      line.append(chip);
    });

    button.onclick = () => {
      const wanted = task.flawed.violation.tokenIndices;
      const correct = wanted.includes(picked);
      finish(task, correct, {
        solution: task.flawed.correct,
        xray: task.flawed.correct,
        reason: escape(task.flawed.violation.message),
      });
    };
    return screen;
  }

  // Umschreiben: der Kern der Sprache. Nicht „wie heißt Kaffee“, sondern
  // „wie drückst du Kaffee mit 120 Wörtern aus“.
  function compoundTask(task) {
    const right = task.compound;
    const options = shuffle([right, ...shuffle(COMPOUNDS.filter((c) => c !== right)).slice(0, 2)]);

    const screen = screenWith(`
      <p class="prompt">dafür gibt es kein wort — wie sagst du es?</p>
      <h2 class="question">${escape(right.de)}</h2>
      <div class="choices"></div>
      <div class="actions"><button class="primary" disabled>Prüfen</button></div>`);

    let picked = null;
    const list = screen.querySelector('.choices');
    const button = screen.querySelector('.primary');
    options.forEach((option) => {
      const choice = el(`<button class="choice tp">${escape(option.tp)}</button>`);
      choice.onclick = () => {
        picked = option;
        list.querySelectorAll('.choice').forEach((c) => { c.dataset.picked = 'false'; });
        choice.dataset.picked = 'true';
        button.disabled = false;
      };
      list.append(choice);
    });

    button.onclick = () => finish(task, picked === right, {
      solution: right.tp,
      xray: right.tp,
      reason: `<b>${escape(right.tp)}</b> — wörtlich: ${escape(right.literal)}.`,
    });
    return screen;
  }

  function buildTask(task) {
    const solution = TP.tokenize(task.item.tp).map((t) => t.text);
    const extras = distractorWords(task.lesson, solution, Math.min(3, Math.max(2, 6 - solution.length)));
    const bank = shuffle(solution.concat(extras));

    const screen = screenWith(`
      <p class="prompt">bau den satz</p>
      <h2 class="question">${escape(task.item.de[0])}</h2>
      <div class="slot"></div>
      <div class="bank"></div>
      <div class="actions"><button class="primary" disabled>Prüfen</button></div>`);

    const slot = screen.querySelector('.slot');
    const bankRow = screen.querySelector('.bank');
    const button = screen.querySelector('.primary');
    const chosen = [];

    const sync = () => {
      slot.innerHTML = '';
      chosen.forEach((word, position) => {
        const tile = el(`<button class="tile placed">${escape(word)}</button>`);
        tile.onclick = () => {
          chosen.splice(position, 1);
          sync();
        };
        slot.append(tile);
      });
      bankRow.querySelectorAll('.tile').forEach((tile) => {
        const used = chosen.filter((w) => w === tile.dataset.word).length;
        const available = bank.filter((w) => w === tile.dataset.word).length;
        tile.classList.toggle('used', Number(tile.dataset.slot) < used || used >= available);
      });
      button.disabled = chosen.length === 0;
    };

    bank.forEach((word, position) => {
      const tile = el(`<button class="tile" data-word="${escape(word)}" data-slot="${position}">${escape(word)}</button>`);
      tile.onclick = () => { chosen.push(word); sync(); };
      bankRow.append(tile);
    });
    sync();

    button.onclick = () => {
      const answer = chosen.join(' ');
      const accepted = [task.item.tp, ...task.item.also]
        .map((s) => TP.tokenize(s).map((t) => t.text).join(' '));
      const correct = accepted.includes(answer);
      finish(task, correct, {
        solution: task.item.tp,
        xray: answer || task.item.tp,
        grade: correct ? null : grade(answer, task.item),
      });
    };
    return screen;
  }

  function freeTask(task) {
    const screen = screenWith(`
      <p class="prompt">schreib es selbst — freie eingabe</p>
      <h2 class="question">${escape(task.item.de[0])}</h2>
      <input class="typed" autocomplete="off" autocapitalize="off" spellcheck="false"
             placeholder="toki pona …" aria-label="Deine Antwort">
      <p class="live"></p>
      <p class="hint">Der Parser prüft den Satzbau, während du tippst. Andere Wortwahl als
        die Musterlösung ist in Ordnung, solange die Grammatik stimmt.</p>
      <div class="actions"><button class="primary" disabled>Prüfen</button></div>`);

    const input = screen.querySelector('.typed');
    const live = screen.querySelector('.live');
    const button = screen.querySelector('.primary');

    input.oninput = () => {
      const text = input.value.trim();
      button.disabled = !text;
      if (!text) { live.textContent = ''; live.className = 'live'; return; }
      const result = TP.parse(text);
      if (result.isValid) {
        live.textContent = '✓ Satzbau in Ordnung';
        live.className = 'live good';
      } else {
        live.textContent = '• ' + result.violations[0].message;
        live.className = 'live bad';
      }
    };
    input.onkeydown = (event) => { if (event.key === 'Enter' && !button.disabled) button.click(); };

    button.onclick = () => {
      const answer = input.value.trim();
      const verdict = grade(answer, task.item);
      finish(task, verdict.correct, {
        solution: task.item.tp,
        xray: answer || task.item.tp,
        grade: verdict,
      });
    };
    setTimeout(() => input.focus(), 50);
    return screen;
  }

  // ------------------------------------------------------------ Bewertung

  // Schichten aus Plan, Abschnitt 6: normalisieren, strukturell parsen,
  // gegen Musterlösung und Pflichtbausteine abgleichen.
  function grade(answer, item) {
    const normalise = (text) => TP.tokenize(text).map((t) => t.text).join(' ');
    const accepted = [item.tp, ...item.also].map(normalise);
    const given = normalise(answer);

    if (accepted.includes(given)) return { correct: true, exact: true, violations: [] };

    const result = TP.parse(answer);
    if (!result.isValid) {
      return { correct: false, exact: false, violations: result.violations, utterance: result.utterance };
    }

    // Grammatisch sauber: zählt, wenn die tragenden Inhaltswörter vorkommen.
    const content = TP.tokenize(item.tp)
      .filter((t) => t.word && !t.word.roles.includes('particle') && !t.word.roles.includes('pronoun'))
      .map((t) => t.text);
    const mine = new Set(TP.tokenize(answer).map((t) => t.text));
    const missing = content.filter((word) => !mine.has(word));

    if (!missing.length) {
      return { correct: true, exact: false, variant: true, violations: [], utterance: result.utterance };
    }
    return {
      correct: false, exact: false, violations: [], utterance: result.utterance,
      missing,
    };
  }

  function finish(task, correct, detail) {
    session.total += 1;
    if (correct) {
      session.correct += 1;
      const points = session.retried.has(session.index) ? 5 : 10;
      session.xp += points;
      award(points);
    } else if ((task.attempts || 0) < 1) {
      // Ein zweiter Anlauf in derselben Sitzung, mehr nicht. Danach ist es
      // Sache des Wiederholungssystems — niemand soll festhängen.
      task.attempts = 1;
      session.retried.add(session.queue.length);
      session.queue.push(task);
    } else {
      task.attempts = 2;
    }
    const key = keyOf(task);
    if (key) schedule(key, correct);
    bumpMastery(task.concepts, correct);
    save();
    showSheet(correct, Object.assign({ parked: task.attempts === 2 }, detail));
  }

  function showSheet(correct, detail) {
    // Die Aufgabe ist beantwortet: „Prüfen“ hat seinen Zweck erfüllt und
    // verschwindet, damit nur noch ein Knopf im Bild ist. Die Antwort bleibt
    // lesbar, lässt sich aber nicht mehr ändern.
    const screen = app.querySelector('.screen');
    if (screen) {
      const actions = screen.querySelector('.actions');
      if (actions) actions.remove();
      screen.classList.add('answered');
    }

    const sheet = el(`
      <div class="sheet">
        <div class="verdict ${correct ? 'good' : 'bad'}">
          <span class="mark">${correct ? '✓' : '✕'}</span>
          <span>${correct
            ? (detail.grade && detail.grade.variant ? 'Richtig — andere Wortwahl, gleiche Aussage' : 'pona!')
            : 'Noch nicht'}</span>
        </div>
      </div>`);

    if (detail.grade && detail.grade.violations && detail.grade.violations.length) {
      const violation = detail.grade.violations[0];
      sheet.append(el(`
        <div class="violation">
          ${escape(violation.message)}
          ${violation.correction ? `<br><code>→ ${escape(violation.correction)}</code>` : ''}
        </div>`));
    } else if (detail.grade && detail.grade.missing) {
      sheet.append(el(`<p class="reason">Satzbau stimmt, aber es fehlt:
        <code>${detail.grade.missing.map(escape).join(', ')}</code></p>`));
    } else if (detail.reason) {
      sheet.append(el(`<p class="reason">${detail.reason}</p>`));
    }

    if (!correct || (detail.grade && detail.grade.variant)) {
      sheet.append(el(`<p class="reason">Musterlösung: <span class="solution">${escape(detail.solution)}</span></p>`));
    }
    if (!correct && detail.parked) {
      sheet.append(el('<p class="hint">Kommt in einer der nächsten Wiederholungen zurück.</p>'));
    }

    if (detail.xray) {
      const spans = TP.xray(TP.parse(detail.xray).utterance);
      if (spans.length) {
        sheet.append(el(`<div class="xray">${spans.map((span) => `
          <span class="span" data-role="${escape(span.role)}">
            <b>${escape(span.text)}</b><i>${escape(span.role)}</i>
          </span>`).join('')}</div>`));
      }
    }

    const next = el(`<button class="primary">${correct ? 'Weiter' : 'Verstanden'}</button>`);
    next.onclick = () => { session.index += 1; render(); };
    sheet.append(next);
    app.append(sheet);
    next.focus();
  }

  function renderDone() {
    const lesson = session.lesson;
    const review = Boolean(session.review);
    if (lesson) {
      state.done[lesson.number] = true;
      lesson.words.forEach((word) => { state.seenWords[word] = true; });
    }
    save();

    const screen = el(`
      <div class="screen done">
        <div class="burst">pona!</div>
        <h2>${escape(review ? 'Wiederholung geschafft' : lesson.title)}</h2>
        <p>${escape(review
          ? 'Die Karten kommen wieder, wenn es Zeit dafür ist.'
          : lesson.note.replace(/<[^>]+>/g, ''))}</p>
        <div class="tally">
          <div><b>+${session.xp}</b><span>xp</span></div>
          <div><b>${session.correct}</b><span>richtig</span></div>
          <div><b>${review ? session.queue.length : lesson.words.length}</b><span>${review ? 'karten' : 'wörter'}</span></div>
        </div>
        <div class="actions">
          <button class="primary">Weiter</button>
          ${review ? '' : '<button class="ghost">Nochmal üben</button>'}
        </div>
      </div>`);

    screen.querySelector('.primary').onclick = () => { session = null; tab = 'pfad'; render(); };
    if (!review) {
      screen.querySelector('.ghost').onclick = () => { session = buildSession(lesson); render(); };
    }
    app.append(topbar());
    app.append(screen);
  }

  // ------------------------------------------------------------ Wörter

  function wordScreen() {
    const screen = screenWith(`
      <input class="search" placeholder="Wort oder Bedeutung suchen …" aria-label="Suche">
      <div class="words"></div>`);
    const list = screen.querySelector('.words');
    const input = screen.querySelector('.search');

    const draw = (query) => {
      list.innerHTML = '';
      const term = query.trim().toLowerCase();
      Object.keys(TP.lexicon).sort().forEach((word) => {
        const entry = TP.lexicon[word];
        const text = entry.glosses.join(', ');
        if (term && !word.includes(term) && !text.toLowerCase().includes(term)) return;
        list.append(el(`
          <div class="word">
            <b>${escape(word)}</b>
            <span>${escape(text)}</span>
            <em>${entry.book === 'pu' ? 'pu' : 'ku'}${state.seenWords[word] ? ' ✓' : ''}</em>
          </div>`));
      });
    };
    input.oninput = () => draw(input.value);
    draw('');
    return screen;
  }

  // ------------------------------------------------------------ Sandkasten

  function sandboxScreen() {
    const screen = screenWith(`
      <div class="hello">
        <h1>o toki!</h1>
        <p>Schreib irgendetwas auf toki pona. Der Parser zerlegt es und sagt dir,
           was er sieht — oder was nicht stimmt.</p>
      </div>
      <input class="typed" autocomplete="off" autocapitalize="off" spellcheck="false"
             value="jan suli li pana e lipu tawa mi." aria-label="Satz">
      <div class="result"></div>`);

    const input = screen.querySelector('.typed');
    const result = screen.querySelector('.result');

    const draw = () => {
      result.innerHTML = '';
      const text = input.value.trim();
      if (!text) return;
      TP.splitUtterances(text).forEach((utterance) => {
        const parsed = TP.parse(utterance);
        const card = el('<div class="card" style="margin-top:0.8rem"></div>');
        const spans = TP.xray(parsed.utterance);
        if (spans.length) {
          card.append(el(`<div class="xray">${spans.map((span) => `
            <span class="span" data-role="${escape(span.role)}">
              <b>${escape(span.text)}</b><i>${escape(span.role)}</i>
            </span>`).join('')}</div>`));
        }
        if (parsed.isValid) {
          card.append(el(`<p class="reason" style="margin-top:0.7rem;color:var(--accent)">
            ✓ Satzbau in Ordnung${parsed.utterance && parsed.utterance.isQuestion ? ' — eine Frage' : ''}</p>`));
        } else {
          parsed.violations.forEach((violation) => {
            card.append(el(`
              <div class="violation" style="margin-top:0.7rem">
                ${escape(violation.message)}
                ${violation.correction ? `<br><code>→ ${escape(violation.correction)}</code>` : ''}
                ${violation.concept ? `<br><code>${escape(CONCEPT_LABELS[violation.concept] || violation.concept)}</code>` : ''}
              </div>`));
          });
        }
        result.append(card);
      });
    };

    input.oninput = draw;
    draw();

    screen.append(el(`
      <p class="foot" style="padding-top:1rem">
        Probier: <code>mi li moku.</code> · <code>jan pi pona li lape.</code> ·
        <code>soweli moku e kili.</code> · <code>jan Claude li pona.</code>
      </p>`));
    return screen;
  }

  render();
})(TOKIPONA_DATA, TokiPona);

</script>

<script>
// Nur auf der gehosteten Seite: dort macht der Service Worker die App
// offline verfügbar. In einer eingebetteten Vorschau bleibt er aus.
if ('serviceWorker' in navigator && window.self === window.top
    && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
