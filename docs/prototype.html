  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, "DejaVu Sans Mono", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;

  /* Als Homescreen-App liegt der Inhalt unter Status- und Home-Leiste.
     Über Variablen, damit die Prüfung beides nachstellen kann. */
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #101314;
    --surface: #191E1F;
    --sunk: #22282A;
    --ink: #E6EAE7;
    --ink-dim: #98A49F;
    --ink-faint: #6E7A76;
    --accent: #5CC7BA;
    --accent-ink: #0B1211;
    --accent-soft: rgba(92, 199, 186, 0.14);
    --gold: #DDAF57;
    --gold-soft: rgba(221, 175, 87, 0.15);
    --wrong: #E9846C;
    --wrong-soft: rgba(233, 132, 108, 0.13);
    --rule: rgba(230, 234, 231, 0.13);
    --rule-strong: rgba(230, 234, 231, 0.3);
    --shadow: 0 1px 0 rgba(0, 0, 0, 0.5);
  }
}

:root[data-theme="dark"] {
  --ground: #101314;
  --surface: #191E1F;
  --sunk: #22282A;
  --ink: #E6EAE7;
  --ink-dim: #98A49F;
  --ink-faint: #6E7A76;
  --accent: #5CC7BA;
  --accent-ink: #0B1211;
  --accent-soft: rgba(92, 199, 186, 0.14);
  --gold: #DDAF57;
  --gold-soft: rgba(221, 175, 87, 0.15);
  --wrong: #E9846C;
  --wrong-soft: rgba(233, 132, 108, 0.13);
  --rule: rgba(230, 234, 231, 0.13);
  --rule-strong: rgba(230, 234, 231, 0.3);
  --shadow: 0 1px 0 rgba(0, 0, 0, 0.5);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible {
  outline: 2px dashed var(--accent);
  outline-offset: 3px;
}

#app {
  max-width: 30rem;
  min-height: 100vh;
  min-height: 100dvh;   /* Safari: vh ignoriert die Werkzeugleiste, dvh nicht */
  margin: 0 auto;
  background: var(--ground);
  display: flex;
  flex-direction: column;
  position: relative;
}

/* ---------------- Kopfzeile ---------------- */

.topbar {
  display: flex;
  align-items: center;
  gap: 0.9rem;
  padding: calc(0.9rem + var(--safe-top)) 1.1rem 0.9rem;
  border-bottom: 1px solid var(--rule);
  background: var(--surface);
  position: sticky;
  top: 0;
  z-index: 5;
}

.level {
  display: flex;
  align-items: center;
  gap: 0.55rem;
  font-family: var(--mono);
  font-size: 0.8125rem;
}

.ring {
  width: 2.1rem;
  height: 2.1rem;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--accent);
  background: var(--accent-soft);
}

.metric {
  display: flex;
  align-items: baseline;
  gap: 0.3rem;
  font-family: var(--mono);
  font-size: 0.8125rem;
  color: var(--ink-dim);
}

.metric b { color: var(--ink); font-variant-numeric: tabular-nums; }
.metric.gold b { color: var(--gold); }
.topbar .spacer { margin-left: auto; }

.goalbar {
  height: 3px;
  background: var(--sunk);
  position: relative;
  overflow: hidden;
}
.goalbar span {
  position: absolute;
  inset: 0 auto 0 0;
  background: var(--gold);
  transition: width 0.4s ease;
}

/* ---------------- Pfad ---------------- */

.screen { padding: 1.1rem; display: flex; flex-direction: column; gap: 1rem; flex: 1; }

.hello h1 {
  font-family: var(--mono);
  font-size: 1.5rem;
  font-weight: 500;
  letter-spacing: -0.02em;
  margin: 0 0 0.15rem;
}
.hello p { margin: 0; color: var(--ink-dim); font-size: 0.9375rem; }

.path { display: flex; flex-direction: column; gap: 0.55rem; }

.lesson {
  display: flex;
  align-items: center;
  gap: 0.9rem;
  width: 100%;
  text-align: left;
  padding: 0.85rem 0.95rem;
  border: 1px solid var(--rule);
  border-radius: 0.7rem;
  background: var(--surface);
  box-shadow: var(--shadow);
}

.lesson[data-state="locked"] { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
.lesson[data-state="current"] { border-color: var(--accent); }

.lesson .badge {
  width: 2.2rem;
  height: 2.2rem;
  flex: none;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-family: var(--mono);
  font-size: 0.8125rem;
  background: var(--sunk);
  color: var(--ink-dim);
}
.lesson[data-state="current"] .badge { background: var(--accent); color: var(--accent-ink); }
.lesson[data-state="done"] .badge { background: var(--accent-soft); color: var(--accent); }

.lesson .body { flex: 1; min-width: 0; }
.lesson .body b { display: block; font-size: 0.9375rem; font-weight: 600; }
.lesson .body span {
  display: block;
  font-family: var(--mono);
  font-size: 0.6875rem;
  color: var(--ink-faint);
  letter-spacing: 0.04em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.dots { display: flex; gap: 2px; flex: none; }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--sunk); }
.dots i.on { background: var(--accent); }

/* ---------------- Karten ---------------- */

.card {
  border: 1px solid var(--rule);
  border-radius: 0.7rem;
  background: var(--surface);
  padding: 0.95rem 1rem;
  box-shadow: var(--shadow);
}

.card h2 {
  font-family: var(--mono);
  font-size: 0.6875rem;
  letter-spacing: 0.12em;
  color: var(--accent);
  margin: 0 0 0.5rem;
  font-weight: 500;
}

.concepts { display: flex; flex-direction: column; gap: 0.5rem; }
.concept { display: flex; align-items: center; gap: 0.6rem; font-size: 0.875rem; }
.concept span { flex: 1; }
.concept .bar { width: 5.5rem; height: 5px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.concept .bar i { display: block; height: 100%; background: var(--accent); transition: width 0.5s ease; }
.concept code { font-family: var(--mono); font-size: 0.75rem; color: var(--ink-faint); }

.row { display: flex; gap: 0.5rem; margin-top: 0.7rem; }
.row .ghost { flex: 1; }

.drawer { display: flex; flex-direction: column; gap: 0.5rem; }
.drawer:not(:empty) { margin-top: 0.6rem; }
.drawer .hint.good { color: var(--accent); }
.drawer .hint.bad { color: var(--wrong); }
.drawer .preview { display: flex; flex-direction: column; gap: 0.5rem; }
.drawer .preview:not(:empty) { margin-top: 0.6rem; }

/* Der eigene Knopf statt „Choose File“ — die Beschriftung des Browsers
   lässt sich nicht übersetzen. */
.pickwrap { display: block; text-align: center; }
.pick { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.pickwrap:focus-within { outline: 2px dashed var(--accent); outline-offset: 3px; }

.paste {
  width: 100%;
  margin-top: 0.5rem;
  font-family: var(--mono);
  font-size: 0.75rem;
  padding: 0.5rem 0.6rem;
  border: 1px solid var(--rule-strong);
  border-radius: 0.5rem;
  background: var(--ground);
  color: var(--ink);
  resize: vertical;
}

/* ---------------- Übung ---------------- */

.exbar {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  padding: calc(0.75rem + var(--safe-top)) 1.1rem 0.75rem;
  position: sticky;
  top: 0;
  z-index: 5;
  border-bottom: 1px solid var(--rule);
  background: var(--surface);
}
.exbar .track { flex: 1; height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.exbar .track i { display: block; height: 100%; background: var(--accent); transition: width 0.35s ease; }
.exbar button {
  background: none;
  border: 0;
  color: var(--ink-faint);
  font-size: 1.25rem;
  line-height: 1;
  padding: 0 0.2rem;
}

.prompt { font-size: 0.8125rem; color: var(--ink-dim); font-family: var(--mono); letter-spacing: 0.03em; }

.question {
  font-size: 1.375rem;
  line-height: 1.35;
  font-weight: 600;
  margin: 0.35rem 0 0;
  text-wrap: balance;
}
.question.tp { font-family: var(--mono); font-weight: 500; color: var(--accent); }

.slot {
  min-height: 3.4rem;
  border-bottom: 2px dashed var(--rule-strong);
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  align-content: flex-start;
  padding-bottom: 0.5rem;
}

.bank { display: flex; flex-wrap: wrap; gap: 0.4rem; }

/* Nach dem Antworten bleibt die Aufgabe sichtbar, aber unantastbar. */
.screen.answered { pointer-events: none; }
/* Kacheln nicht mit abblenden: sie tragen ihren eigenen Zustand (gelegt,
   belegt), und ein pauschales opacity würde „belegt“ überstimmen — dann sähen
   verbrauchte Vorratskacheln nach dem Auflösen wieder verfügbar aus. */
.screen.answered .choice,
.screen.answered .typed { opacity: 0.75; }

.tile {
  font-family: var(--mono);
  font-size: 0.9375rem;
  padding: 0.5rem 0.7rem;
  border: 1px solid var(--rule-strong);
  border-radius: 0.45rem;
  background: var(--surface);
  box-shadow: var(--shadow);
}
.tile.used { opacity: 0.25; pointer-events: none; }

.tile.placed {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
  /* Ziehen statt Scrollen, sobald der Finger auf einer gelegten Kachel liegt. */
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  transition: transform 0.12s ease;
}

.tile.placed.dragging {
  z-index: 3;
  position: relative;
  transition: none;
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.28);
  border-color: var(--accent);
  cursor: grabbing;
}

@media (hover: hover) and (pointer: fine) {
  .tile.placed { cursor: grab; }
}

@media (prefers-reduced-motion: reduce) {
  .tile.placed { transition: none; }
}

.choices { display: flex; flex-direction: column; gap: 0.5rem; }

.choice {
  text-align: left;
  padding: 0.75rem 0.85rem;
  border: 1px solid var(--rule-strong);
  border-radius: 0.55rem;
  background: var(--surface);
  font-size: 0.9375rem;
  box-shadow: var(--shadow);
}
.choice[data-picked="true"] { border-color: var(--accent); background: var(--accent-soft); }
.choice.tp { font-family: var(--mono); }

.typed {
  width: 100%;
  font-family: var(--mono);
  font-size: 1.0625rem;
  padding: 0.7rem 0.8rem;
  border: 1px solid var(--rule-strong);
  border-radius: 0.55rem;
  background: var(--surface);
  color: var(--ink);
}

.live {
  font-family: var(--mono);
  font-size: 0.75rem;
  color: var(--ink-faint);
  min-height: 1.2rem;
  margin-top: 0.4rem;
}
.live.bad { color: var(--wrong); }
.live.good { color: var(--accent); }

.hint { font-size: 0.8125rem; color: var(--ink-faint); margin: 0; }

.actions {
  margin-top: auto;
  padding-top: 1rem;
  padding-bottom: max(var(--safe-bottom), 0.25rem);
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.primary {
  width: 100%;
  padding: 0.85rem;
  border: 0;
  border-radius: 0.6rem;
  background: var(--accent);
  color: var(--accent-ink);
  font-weight: 650;
  font-size: 1rem;
}
.primary[disabled] { background: var(--sunk); color: var(--ink-faint); cursor: not-allowed; }

.ghost {
  width: 100%;
  padding: 0.7rem;
  border: 1px solid var(--rule-strong);
  border-radius: 0.6rem;
  background: none;
  font-size: 0.9375rem;
}

.pickline {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  margin: 0.9rem 0 0.2rem;
}

.lesson.review .badge { background: var(--gold-soft); color: var(--gold); font-size: 1rem; }
.lesson.review { border-color: var(--gold); }

/* Zeigergeräte bekommen eine Hover-Rückmeldung. Auf Tippgeräten bliebe sie
   nach der Berührung kleben und sähe aus wie eine getroffene Auswahl. */
@media (hover: hover) and (pointer: fine) {
  .lesson:not([data-state="locked"]):hover { border-color: var(--accent); }
  .tile:hover { border-color: var(--accent); }
  .choice:hover { border-color: var(--accent); }
}

/* Stattdessen quittiert die Berührung selbst. */
.tile:active, .choice:active, .lesson:not([data-state="locked"]):active { transform: scale(0.985); }
.primary:active, .ghost:active { transform: scale(0.99); }

/* ---------------- Wortnachschlag ---------------- */

/* Ein gepunkteter Strich verrät, dass hier etwas nachzuschlagen ist —
   auf dem Telefon gibt es kein Hover, das darauf hinweisen könnte. */
.gloss-word {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  margin: 0;
  text-decoration: underline dotted;
  text-underline-offset: 0.22em;
  text-decoration-thickness: 1px;
  text-decoration-color: currentColor;
  opacity: 0.999;   /* eigener Malkontext, sonst flackert der Strich beim Antippen */
}

.gloss-word:active { background: var(--accent-soft); border-radius: 0.2rem; }

@media (hover: hover) and (pointer: fine) {
  .gloss-word { cursor: help; }
  .gloss-word:hover { background: var(--accent-soft); border-radius: 0.2rem; }
}

.glossline { display: inline; }

.bubble {
  position: absolute;
  z-index: 20;
  max-width: min(20rem, calc(100% - 1rem));
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.5rem 0.7rem;
  border: 1px solid var(--rule-strong);
  border-radius: 0.5rem;
  background: var(--surface);
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
  animation: bubble-in 0.12s ease;
}

@keyframes bubble-in { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .bubble { animation: none; } }

.bubble-glyph { font-size: 2rem; line-height: 1; color: var(--accent); flex: none; }
.bubble-body { display: flex; flex-direction: column; gap: 0.1rem; min-width: 0; }
.bubble-body b { font-family: var(--mono); font-weight: 500; font-size: 0.9375rem; color: var(--accent); }
.bubble-body span { font-size: 0.8125rem; color: var(--ink-dim); }
.bubble em {
  font-family: var(--mono);
  font-style: normal;
  font-size: 0.625rem;
  letter-spacing: 0.08em;
  color: var(--ink-faint);
  align-self: flex-start;
  flex: none;
}

/* ---------------- Rückmeldung ---------------- */

.sheet {
  position: sticky;
  bottom: 0;
  border-top: 1px solid var(--rule-strong);
  background: var(--surface);
  padding: 0.9rem 1.1rem calc(1.1rem + var(--safe-bottom));
  display: flex;
  flex-direction: column;
  gap: 0.7rem;
  animation: rise 0.22s ease;
}
@keyframes rise { from { transform: translateY(100%); } to { transform: translateY(0); } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } * { transition: none !important; } }

.verdict { display: flex; align-items: center; gap: 0.5rem; font-weight: 650; }
.verdict.good { color: var(--accent); }
.verdict.bad { color: var(--wrong); }
.verdict .mark {
  width: 1.4rem; height: 1.4rem; border-radius: 50%;
  display: grid; place-items: center; font-size: 0.8125rem;
  background: var(--accent-soft);
}
.verdict.bad .mark { background: var(--wrong-soft); }

.reason { font-size: 0.9375rem; margin: 0; }
.reason code {
  font-family: var(--mono);
  background: var(--sunk);
  padding: 0.05em 0.3em;
  border-radius: 0.2rem;
}

.solution { font-family: var(--mono); font-size: 0.9375rem; color: var(--accent); }

/* ---------------- Satzröntgen ---------------- */

.xray { display: flex; flex-wrap: wrap; gap: 0.35rem; }
.xray .span { display: flex; flex-direction: column; gap: 0.15rem; align-items: center; }
.xray .span b {
  font-family: var(--mono);
  font-weight: 500;
  font-size: 0.875rem;
  padding: 0.3rem 0.5rem;
  border: 1px solid var(--rule);
  border-radius: 0.35rem;
  background: var(--sunk);
  white-space: nowrap;
}
.xray .span i {
  font-family: var(--mono);
  font-style: normal;
  font-size: 0.5625rem;
  letter-spacing: 0.08em;
  color: var(--ink-faint);
  text-transform: uppercase;
}
.xray .span[data-role="predicateMarker"] b,
.xray .span[data-role="object"] b,
.xray .span[data-role="preposition"] b,
.xray .span[data-role="directive"] b {
  color: var(--accent);
  background: var(--accent-soft);
  border-color: var(--accent);
}

/* ---------------- Abschluss ---------------- */

.done { text-align: center; display: flex; flex-direction: column; gap: 0.6rem; padding-top: 2.5rem; }
.done .burst {
  font-family: var(--mono);
  font-size: 2.75rem;
  color: var(--accent);
  animation: pop 0.45s cubic-bezier(0.2, 1.4, 0.4, 1);
}
@keyframes pop { from { transform: scale(0.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.done h2 { margin: 0; font-size: 1.25rem; }
.done p { margin: 0; color: var(--ink-dim); }

.tally { display: flex; justify-content: center; gap: 1.75rem; margin: 0.9rem 0; }
.tally div { display: flex; flex-direction: column; gap: 0.1rem; }
.tally b { font-family: var(--mono); font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.tally span { font-family: var(--mono); font-size: 0.625rem; letter-spacing: 0.1em; color: var(--ink-faint); }

/* ---------------- sitelen pona ---------------- */

/* Die Schrift bildet Wörter über Ligaturen ab; im Text steht weiterhin
   lateinisch, was Kopieren und Vorlesen erhält. */
.sp { font-family: 'linja pimeja', var(--mono); font-feature-settings: 'liga' 1, 'clig' 1; }

.glyph {
  font-size: 7rem;
  line-height: 1.05;
  color: var(--accent);
  text-align: center;
  margin: 1.5rem 0 0.5rem;
}

.glyph-inline { font-size: 2rem; line-height: 1; color: var(--accent); }

.glyph-row {
  font-size: 2.75rem;
  color: var(--accent);
  margin-bottom: 0.5rem;
  word-spacing: 0.25em;
}

.glyph-inline.empty { display: inline-block; }

.word .glyph-inline {
  font-size: 2.5rem;
  min-width: 2.9rem;
  text-align: center;
  flex: none;
  color: var(--accent);
}

/* ---------------- Wörter & Sandkasten ---------------- */

.search {
  width: 100%;
  padding: 0.6rem 0.8rem;
  border: 1px solid var(--rule-strong);
  border-radius: 0.55rem;
  background: var(--surface);
  color: var(--ink);
  font-size: 0.9375rem;
}

.words { display: flex; flex-direction: column; gap: 0; }
.word {
  display: flex;
  gap: 0.7rem;
  padding: 0.55rem 0.2rem;
  border-bottom: 1px solid var(--rule);
  align-items: center;
}
.word b {
  font-family: var(--mono);
  font-weight: 500;
  min-width: 5.5rem;
  overflow-wrap: anywhere;   /* kijetesantakalu passt in keine Spalte */
}

/* min-width: 0 erlaubt dem Flex-Kind, unter seine Inhaltsbreite zu schrumpfen —
   ohne das schiebt eine lange Bedeutung die ganze Zeile aus dem Bild. */
.word span:not(.glyph-inline) {
  color: var(--ink-dim);
  font-size: 0.875rem;
  flex: 1;
  min-width: 0;
  overflow-wrap: anywhere;   /* „geschlechtsnonkonform“ passt sonst nirgends */
}
.word em {
  font-family: var(--mono);
  font-style: normal;
  font-size: 0.625rem;
  color: var(--ink-faint);
  letter-spacing: 0.08em;
}

.violation {
  border-left: 2px solid var(--wrong);
  padding: 0.1rem 0 0.1rem 0.7rem;
  font-size: 0.875rem;
}
.violation code { font-family: var(--mono); font-size: 0.75rem; color: var(--ink-faint); }

/* ---------------- Reiter ---------------- */

.tabs {
  display: flex;
  border-top: 1px solid var(--rule);
  background: var(--surface);
  position: sticky;
  bottom: 0;
  z-index: 5;
}
.tabs button {
  flex: 1;
  border: 0;
  background: none;
  padding: 0.7rem 0.3rem calc(0.7rem + var(--safe-bottom));
  font-family: var(--mono);
  font-size: 0.6875rem;
  letter-spacing: 0.06em;
  color: var(--ink-faint);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.15rem;
}
.tabs button[data-active="true"] { color: var(--accent); }
.tabs button .glyph { font-size: 1rem; line-height: 1; }

.foot {
  font-size: 0.6875rem;
  color: var(--ink-faint);
  line-height: 1.5;
  padding: 0.5rem 0 0;
}
.foot a { color: var(--ink-faint); }

/* Neue Fassung: schmaler Streifen unten, der die laufende Übung stehen lässt. */
.updatebar {
  position: fixed;
  left: 0.75rem;
  right: 0.75rem;
  bottom: calc(0.75rem + var(--safe-bottom));
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  padding: 0.6rem 0.75rem 0.6rem 0.9rem;
  border-radius: 0.9rem;
  background: var(--accent);
  color: var(--accent-ink);
  font-size: 0.8125rem;
  box-shadow: 0 0.6rem 1.6rem rgba(0, 0, 0, 0.25);
}
.updatebar button {
  flex: none;
  padding: 0.35rem 0.7rem;
  border-radius: 0.6rem;
  border: 1px solid currentColor;
  background: transparent;
  color: inherit;
  font: inherit;
  font-weight: 600;
}

.version { opacity: 0.75; }

/* ---------------------------------------------------------------- musi */
.musilines { display: flex; flex-direction: column; }
.musiline { padding: 0.55rem 0; border-top: 1px solid var(--rule); }
.musiline:first-child { border-top: 0; padding-top: 0.1rem; }
.musiline p { margin: 0; }
.musiline .tp,
.forged .tp {
  font-family: var(--mono);
  color: var(--accent);
  font-size: 0.9375rem;
  line-height: 1.5;
  overflow-wrap: anywhere;
}
.musiline .meaning,
.forged .meaning { font-size: 0.9375rem; margin-top: 0.1rem; }
.musiline .hint,
.forged .hint { font-size: 0.75rem; margin-top: 0.15rem; }
.sting { color: var(--gold); letter-spacing: 0.08em; margin-left: 0.35rem; white-space: nowrap; }

.forged {
  border-left: 2px solid var(--accent-soft);
  padding: 0.15rem 0 0.15rem 0.7rem;
  margin-top: 0.6rem;
}
.forged .hint code { font-family: var(--mono); color: var(--ink-faint); }

/* --------------------------------------------------------- Aussprache */
.say {
  flex: none;
  margin-left: 0.4rem;
  width: 1.65rem;
  height: 1.65rem;
  padding: 0;
  border: 1px solid var(--rule);
  border-radius: 50%;
  background: var(--surface);
  color: var(--accent);
  font-size: 0.8125rem;
  line-height: 1;
  vertical-align: middle;
}
.say:active { background: var(--accent-soft); }
.word .say { margin-left: auto; }

.playbox {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.5rem;
  padding: 1.2rem 0 0.6rem;
}
.playbox .play {
  width: 5rem;
  height: 5rem;
  border-radius: 50%;
  border: 0;
  background: var(--accent);
  color: var(--accent-ink);
  font-size: 2rem;
  line-height: 1;
  box-shadow: 0 0.4rem 1.2rem var(--accent-soft);
}
.playbox .play:active { transform: scale(0.96); }
.playbox .hint { margin: 0; }

/* Offene Frage: die Übersetzung unter der toki-pona-Frage */
.ask {
  margin: 0.15rem 0 0.9rem;
  color: var(--ink-dim);
  font-size: 0.9375rem;
}

          predicateMarker: 'predicate', directive: 'command', preverb: 'preverb', verb: 'verb',
          complement: 'complement', object: 'object', preposition: 'preposition' },
  };

  const roleLabel = (role, lang) => (ROLES[lang] || ROLES.de)[role] || role;

  function describe(violation, lang) {
    const table = MESSAGES[lang] || MESSAGES.de;
    const make = table[violation.key] || MESSAGES.de[violation.key];
    return make ? make(violation.params || {}, table) : violation.key;
  }

  const CONCEPT_OF_RULE = {
    liAfterMiSina: 'c_mi_sina',
    missingLi: 'c_li', missingSubject: 'c_li', missingPredicate: 'c_li', repeatedParticle: 'c_li',
    objectWithoutNoun: 'c_e_objekt',
    piWithSingleWord: 'c_pi', piWithoutContent: 'c_pi',
    vocativeWithoutContent: 'c_o',
    emptyContext: 'c_la', contextWithoutClause: 'c_la',
    properNameNotTokiponized: 'c_namen', properNameAsHead: 'c_namen',
  };

  class Engine {
    constructor(tokens) {
      this.tokens = tokens;
      this.pos = 0;
      this.limit = tokens.length;
      this.violations = [];
      this.suppress = false;
    }

    report(rule, tokens, key, params = {}, correction = null) {
      if (this.suppress && (rule === 'unknownWord' || rule === 'properNameNotTokiponized')) return;
      this.violations.push({
        rule, key, params, correction,
        concept: CONCEPT_OF_RULE[rule] || null,
        tokenIndices: tokens.map((t) => t.index),
      });
    }

    run() {
      if (!this.tokens.length) { this.report('emptyUtterance', [], 'emptyUtterance'); return null; }
      this.reportLexicalIssues();

      let start = 0, end = this.tokens.length;
      const finals = [];
      let question = this.tokens.some((t) => t.text === 'seme' && t.word);

      if (end - start > 1 && this.tokens[start].text === 'taso' && this.tokens[start].word) start += 1;

      let changed = true;
      while (changed) {
        changed = false;
        if (end - start >= 3
            && this.tokens[end - 2].text === 'anu' && this.tokens[end - 2].word
            && this.tokens[end - 1].text === 'seme' && this.tokens[end - 1].word) {
          question = true;
          finals.unshift(this.tokens[end - 2], this.tokens[end - 1]);
          end -= 2; changed = true;
        }
        while (end - start > 1 && this.tokens[end - 1].word
               && (this.tokens[end - 1].text === 'a' || this.tokens[end - 1].text === 'kin')) {
          finals.unshift(this.tokens[end - 1]);
          end -= 1; changed = true;
        }
      }

      const interjection = { contexts: [], clause: { kind: 'interjection', subjects: [], predicates: [] },
                             finalParticles: finals, isQuestion: question };
      if (start >= end) return interjection;
      if (end - start === 1) {
        const word = this.tokens[start].word;
        if (word && word.roles.includes('interjection')) return interjection;
      }

      const contexts = [];
      let segment = start;
      for (;;) {
        const la = this.indexOfTopLevel('la', segment, end);
        if (la === null) break;
        if (la === segment) {
          this.report('emptyContext', [this.tokens[la]], 'emptyContext');
        } else {
          const clause = this.parseClause(segment, la);
          if (clause) {
            if (clause.kind === 'fragment' && clause.subjects.length === 1) {
              contexts.push({ kind: 'phrase', phrase: clause.subjects[0] });
            } else contexts.push({ kind: 'clause', clause });
          }
        }
        segment = la + 1;
      }

      if (segment >= end) {
        this.report('contextWithoutClause', [this.tokens[end - 1]], 'contextWithoutClause');
        return { contexts, clause: null, finalParticles: finals, isQuestion: question };
      }

      const clause = this.parseClause(segment, end);
      if (clause && clause.predicates.some((p) => p.isPolarQuestion)) question = true;
      return { contexts, clause, finalParticles: finals, isQuestion: question };
    }

    reportLexicalIssues() {
      for (const token of this.tokens) {
        if (token.kind === 'unknown') {
          this.report('unknownWord', [token],
            token.suggestion ? 'unknownWordSuggest' : 'unknownWord',
            { word: token.original, suggestion: token.suggestion },
            token.suggestion);
        } else if (token.kind === 'malformedName') {
          this.report('properNameNotTokiponized', [token], 'properNameNotTokiponized',
            { word: token.original, kind: token.problem.kind, detail: token.problem.detail });
        }
      }
    }

    parseClause(from, to) {
      if (from >= to) return null;

      const oIndex = this.indexOfTopLevel('o', from, to);
      if (oIndex !== null) return this.parseDirective(from, oIndex, to);

      const liIndex = this.indexOfTopLevel('li', from, to);

      if (liIndex === from) {
        this.report('missingSubject', [this.tokens[liIndex]], 'missingSubject');
      }
      if (liIndex === from + 1 && this.isBarePronoun(this.tokens[from])) {
        this.report('liAfterMiSina', [this.tokens[liIndex]], 'liAfterMiSina',
          { word: this.tokens[from].text },
          this.tokens[from].text + ' ' + this.tokens.slice(from + 2, to).map((t) => t.text).join(' '));
      }

      let subjects = [], predicates = [];

      if (liIndex !== null) {
        if (liIndex > from) {
          this.pos = from; this.limit = liIndex;
          subjects = this.parseSubjectChain();
          this.reportLeftovers(liIndex);
        }
        this.pos = liIndex; this.limit = to;
        predicates = this.parsePredicateChain();
      } else if (this.isBarePronoun(this.tokens[from])) {
        this.pos = from; this.limit = Math.min(from + 1, to);
        const subject = this.parseNounPhrase();
        if (subject) subjects = [subject];
        this.pos = from + 1; this.limit = to;
        if (this.pos < to) {
          predicates = [this.parsePredicate(null)];
          predicates = predicates.concat(this.parsePredicateChain());
        }
      } else {
        this.pos = from; this.limit = to;
        subjects = this.parseSubjectChain();
        if (this.pos < to) {
          if (isParticle(this.tokens[this.pos], 'e')) {
            this.report('missingLi', [this.tokens[this.pos]], 'missingLi', {},
              this.correctionWithLi(from, to));
            this.pos = to;
            return { kind: 'declarative', subjects, predicates: [] };
          }
          this.reportLeftovers(to);
        }
        return { kind: 'fragment', subjects, predicates: [] };
      }

      return { kind: 'declarative', subjects, predicates };
    }

    parseDirective(from, oIndex, to) {
      let subjects = [];
      if (oIndex > from) {
        this.pos = from; this.limit = oIndex;
        subjects = this.parseSubjectChain();
        this.reportLeftovers(oIndex);
      }
      const marker = this.tokens[oIndex];
      this.pos = oIndex + 1; this.limit = to;
      let predicates = [];
      if (this.pos < to) {
        predicates.push(this.parsePredicate(marker));
        predicates = predicates.concat(this.parsePredicateChain());
      }
      if (!subjects.length && !predicates.length) {
        this.report('vocativeWithoutContent', [marker], 'vocativeWithoutContent');
      }
      return { kind: predicates.length ? 'imperative' : 'vocative', subjects, predicates };
    }

    parseSubjectChain() {
      const phrases = [];
      const first = this.parseNounPhrase(true);
      if (!first) return phrases;
      phrases.push(first);
      while (this.pos < this.limit
             && (isParticle(this.tokens[this.pos], 'en') || isParticle(this.tokens[this.pos], 'anu'))) {
        this.pos += 1;
        const next = this.parseNounPhrase(true);
        if (!next) break;
        phrases.push(next);
      }
      return phrases;
    }

    chainsPredicate(token) {
      return isParticle(token, 'li') || isParticle(token, 'anu');
    }

    parsePredicateChain() {
      const predicates = [];
      while (this.pos < this.limit && this.chainsPredicate(this.tokens[this.pos])) {
        const marker = this.tokens[this.pos];
        this.pos += 1;
        if (this.pos < this.limit && isParticle(this.tokens[this.pos], 'li')) {
          this.report('repeatedParticle', [this.tokens[this.pos]], 'repeatedParticle', { word: 'li' });
          continue;
        }
        predicates.push(this.parsePredicate(marker));
      }
      return predicates;
    }

    parsePredicate(marker) {
      const preverbs = [];
      let negated = false, polar = false;

      while (this.pos < this.limit && isPreverb(this.tokens[this.pos])) {
        const preverb = this.tokens[this.pos];
        if (this.pos + 1 >= this.limit) break;
        const next = this.tokens[this.pos + 1];
        if (isBoundary(next)) break;
        if (next.text === 'ala' && next.word) {
          if (this.pos + 2 < this.limit && this.tokens[this.pos + 2].text === preverb.text) {
            if (this.pos + 3 >= this.limit || isBoundary(this.tokens[this.pos + 3])) break;
            polar = true;
            preverbs.push({ token: preverb, isNegated: false });
            this.pos += 3;
            continue;
          }
          if (this.pos + 2 < this.limit && !isBoundary(this.tokens[this.pos + 2])) {
            preverbs.push({ token: preverb, isNegated: true });
            negated = true;
            this.pos += 2;
            continue;
          }
          break;
        }
        preverbs.push({ token: preverb, isNegated: false });
        this.pos += 1;
      }

      let core = { kind: 'missing' };
      if (this.pos < this.limit && isPreposition(this.tokens[this.pos])) {
        core = { kind: 'prepositional', phrase: this.parsePrepositionalPhrase() };
      } else if (this.pos < this.limit && !isBoundary(this.tokens[this.pos])) {
        const phrase = this.parseNounPhrase();
        if (phrase) core = { kind: 'phrase', phrase };
      } else {
        this.report('missingPredicate', marker ? [marker] : [], 'missingPredicate',
          { word: marker ? marker.text : null });
      }

      if (core.kind === 'phrase') {
        const mods = core.phrase.modifiers;
        mods.forEach((modifier, offset) => {
          if (modifier.kind !== 'simple' || modifier.token.text !== 'ala' || !modifier.token.word) return;
          const following = mods[offset + 1];
          if (following && following.kind === 'simple'
              && following.token.text === core.phrase.head.text) polar = true;
          else negated = true;
        });
      }

      const objects = [], prepositions = [];
      while (this.pos < this.limit) {
        const token = this.tokens[this.pos];
        if (isParticle(token, 'e')) {
          this.pos += 1;
          if (this.pos < this.limit && isParticle(this.tokens[this.pos], 'e')) {
            this.report('repeatedParticle', [this.tokens[this.pos]], 'repeatedParticle', { word: 'e' });
            continue;
          }
          const object = this.parseNounPhrase();
          if (object) {
            objects.push(object);
            while (this.pos < this.limit && isParticle(this.tokens[this.pos], 'en')) {
              this.pos += 1;
              const further = this.parseNounPhrase();
              if (!further) break;
              objects.push(further);
            }
          } else {
            this.report('objectWithoutNoun', [token], 'objectWithoutNoun');
          }
        } else if (isPreposition(token)) {
          const phrase = this.parsePrepositionalPhrase();
          if (phrase.object === null) {
            if (objects.length) objects[objects.length - 1].modifiers.push({ kind: 'simple', token });
            else if (core.kind === 'phrase') core.phrase.modifiers.push({ kind: 'simple', token });
            else prepositions.push(phrase);
          } else prepositions.push(phrase);
        } else break;
      }

      if (this.pos < this.limit && !this.chainsPredicate(this.tokens[this.pos])) {
        this.report('unexpectedToken', [this.tokens[this.pos]], 'unexpectedToken',
          { word: this.tokens[this.pos].original });
        while (this.pos < this.limit && !this.chainsPredicate(this.tokens[this.pos])) this.pos += 1;
      }

      return { marker, preverbs, core, objects, prepositions, isNegated: negated, isPolarQuestion: polar };
    }

    parsePrepositionalPhrase() {
      const preposition = this.tokens[this.pos];
      this.pos += 1;
      let object = null;
      if (this.pos < this.limit && !isBoundary(this.tokens[this.pos])
          && !isParticle(this.tokens[this.pos], 'pi')) {
        object = this.parseNounPhrase();
      }
      return { preposition, object };
    }

    parseNounPhrase(allowPrepositionAsModifier = false) {
      if (this.pos >= this.limit) return null;
      const head = this.tokens[this.pos];

      if (isBoundary(head) || isParticle(head, 'pi')) {
        this.report('particleInPhrasePosition', [head], 'particleInPhrasePosition', { word: head.text });
        return null;
      }
      if (isProperName(head)) {
        this.report('properNameAsHead', [head], 'properNameAsHead', {}, `jan ${head.original}`);
      }

      this.pos += 1;
      const modifiers = [];
      let embedded = null;

      if (head.followedByColon) {
        embedded = this.parseEmbedded();
        return { head, modifiers, embedded };
      }

      while (this.pos < this.limit) {
        const token = this.tokens[this.pos];

        if (isParticle(token, 'pi')) {
          this.pos += 1;
          const group = [];
          while (this.pos < this.limit && !isBoundary(this.tokens[this.pos])
                 && !isParticle(this.tokens[this.pos], 'pi') && canModify(this.tokens[this.pos])) {
            group.push(this.tokens[this.pos]);
            this.pos += 1;
          }
          if (!group.length) {
            this.report('piWithoutContent', [token], 'piWithoutContent');
          } else if (group.length === 1) {
            this.report('piWithSingleWord', [token, group[0]], 'piWithSingleWord', {},
              `${head.text} ${group[0].text}`);
            modifiers.push({ kind: 'simple', token: group[0] });
          } else {
            modifiers.push({ kind: 'group', tokens: group });
          }
          continue;
        }

        if (isBoundary(token)) break;
        if (isPreposition(token) && !allowPrepositionAsModifier) break;
        if (!canModify(token)) break;

        modifiers.push({ kind: 'simple', token });
        this.pos += 1;

        if (token.followedByColon) { embedded = this.parseEmbedded(); break; }
      }

      return { head, modifiers, embedded };
    }

    parseEmbedded() {
      if (this.pos >= this.limit) return null;
      const slice = this.tokens.slice(this.pos, this.limit);
      this.pos = this.limit;
      const engine = new Engine(slice);
      engine.suppress = true;
      const utterance = engine.run();
      if (!utterance) return null;
      this.violations = this.violations.concat(engine.violations);
      return utterance;
    }

    indexOfTopLevel(particle, from, to) {
      for (let index = from; index < to; index += 1) {
        if (isParticle(this.tokens[index], particle)) return index;
        if (this.tokens[index].followedByColon) return null;
      }
      return null;
    }

    isBarePronoun(token) {
      return token.word !== null && token.word.roles.includes('pronoun')
        && (token.text === 'mi' || token.text === 'sina');
    }

    reportLeftovers(bound) {
      if (this.pos >= bound) return;
      this.report('unexpectedToken', [this.tokens[this.pos]], 'unexpectedToken',
        { word: this.tokens[this.pos].original });
      this.pos = bound;
    }

    correctionWithLi(from, to) {
      const objectIndex = this.indexOfTopLevel('e', from, to);
      if (objectIndex === null) return null;
      const insertion = Math.max(from + 1, objectIndex - 1);
      const words = this.tokens.slice(from, to).map((t) => t.text);
      words.splice(insertion - from, 0, 'li');
      return words.join(' ');
    }
  }

  function parse(input) {
    const tokens = tokenize(input);
    const engine = new Engine(tokens);
    const utterance = engine.run();
    return { tokens, utterance, violations: engine.violations, isValid: !engine.violations.length };
  }

  // ---------------------------------------------------------------- Satzröntgen

  const phraseTokens = (phrase) => {
    const out = [phrase.head];
    for (const modifier of phrase.modifiers) {
      if (modifier.kind === 'group') out.push(...modifier.tokens);
      else out.push(modifier.token);
    }
    return out;
  };
  const phraseText = (phrase) => phraseTokens(phrase).map((t) => t.text).join(' ');

  // ------------------------------------------------- gleichwertige Stellung

  // Beifügungen desselben Kopfworts dürfen die Plätze tauschen, ohne dass sich
  // die Aussage ändert: „jan lili mije“ und „jan mije lili“ sind beide der
  // kleine männliche Mensch. Ein paar Wörter binden allerdings fester und
  // dürfen nicht wandern — Zahlen und Mengen, die Verneinung, und die
  // Präpositionen, die feste Fügungen bilden (tomo tawa ist ein Fahrzeug).
  const FIXED_ORDER = new Set([
    'ala', 'taso', 'kin', 'seme', 'nanpa', 'mute', 'wan', 'tu', 'luka', 'ale', 'ali',
    'tawa', 'lon', 'tan', 'kepeken', 'sama',
  ]);

  // Alle Wortgruppen eines Satzes einsammeln — dieselben Stellen, die auch das
  // Satzröntgen beschriftet.
  function collectPhrases(utterance, out) {
    const found = out || [];
    if (!utterance) return found;
    const take = (phrase) => {
      if (!phrase) return;
      found.push(phrase);
      if (phrase.embedded) collectPhrases(phrase.embedded, found);
    };
    const clause = (node) => {
      if (!node) return;
      node.subjects.forEach(take);
      for (const predicate of node.predicates) {
        if (predicate.core.kind === 'phrase') take(predicate.core.phrase);
        else if (predicate.core.phrase) take(predicate.core.phrase.object);
        predicate.objects.forEach(take);
        for (const prepositional of predicate.prepositions) take(prepositional.object);
      }
    };
    for (const context of utterance.contexts) {
      if (context.kind === 'phrase') take(context.phrase);
      else clause(context.clause);
    }
    clause(utterance.clause);
    return found;
  }

  // Vergleichsform eines Satzes: fehlerfrei geparst, und in jeder Wortgruppe
  // stehen die vertauschbaren Beifügungen alphabetisch. Zwei Sätze mit
  // derselben Vergleichsform sagen dasselbe.
  function canonical(input) {
    const { tokens, utterance, isValid } = parse(input);
    if (!isValid || !utterance) return null;
    const words = tokens.map((token) => token.text);

    for (const phrase of collectPhrases(utterance)) {
      const modifiers = phrase.modifiers || [];
      if (modifiers.length < 2) continue;
      // pi-Gruppen bleiben, wo sie sind: ihre Reichweite hängt am Platz.
      if (modifiers.some((modifier) => modifier.kind !== 'simple')) continue;
      // Namen bleiben am Kopfwort kleben: jan Sonja suli, nicht jan suli Sonja.
      if (modifiers.some((modifier) => modifier.token.kind !== 'known')) continue;
      const texts = modifiers.map((modifier) => modifier.token.text);
      if (texts.some((text) => FIXED_ORDER.has(text))) continue;
      const places = modifiers.map((modifier) => modifier.token.index);
      // Nur zusammenhängende Beifügungen umsortieren.
      if (places.some((place, i) => i > 0 && place !== places[i - 1] + 1)) continue;
      const sorted = texts.slice().sort();
      places.forEach((place, i) => { words[place] = sorted[i]; });
    }
    return words.join(' ');
  }

  // Sagen zwei Sätze dasselbe, obwohl sie verschieden geschrieben sind?
  function sameMeaning(a, b) {
    const left = canonical(a);
    const right = canonical(b);
    return Boolean(left && right && left === right);
  }

  function xray(utterance) {
    if (!utterance) return [];
    const spans = [];
    const push = (tokens, role) => spans.push({
      text: tokens.map((t) => t.text).join(' '), role, indices: tokens.map((t) => t.index),
    });

    for (const context of utterance.contexts) {
      if (context.kind === 'phrase') push(phraseTokens(context.phrase), 'context');
      else spans.push(...clauseSpans(context.clause, true));
    }
    if (utterance.clause) spans.push(...clauseSpans(utterance.clause, false));
    for (const particle of utterance.finalParticles) push([particle], 'particle');
    return spans;

    function clauseSpans(clause, contextual) {
      const out = [];
      const add = (tokens, role) => out.push({
        text: tokens.map((t) => t.text).join(' '), role, indices: tokens.map((t) => t.index),
      });
      const vocative = clause.kind === 'vocative' || clause.kind === 'imperative';
      for (const subject of clause.subjects) {
        add(phraseTokens(subject), vocative ? 'vocative' : (contextual ? 'context' : 'subject'));
        if (subject.embedded) out.push(...xray(subject.embedded));
      }
      for (const predicate of clause.predicates) {
        if (predicate.marker) {
          add([predicate.marker], predicate.marker.text === 'o' ? 'directive' : 'predicateMarker');
        }
        for (const preverb of predicate.preverbs) add([preverb.token], 'preverb');
        if (predicate.core.kind === 'phrase') {
          add(phraseTokens(predicate.core.phrase), 'verb');
          if (predicate.core.phrase.embedded) out.push(...xray(predicate.core.phrase.embedded));
        } else if (predicate.core.kind === 'prepositional') {
          add([predicate.core.phrase.preposition], 'verb');
          if (predicate.core.phrase.object) add(phraseTokens(predicate.core.phrase.object), 'complement');
        }
        for (const object of predicate.objects) {
          add(phraseTokens(object), 'object');
          if (object.embedded) out.push(...xray(object.embedded));
        }
        for (const prepositional of predicate.prepositions) {
          add([prepositional.preposition], 'preposition');
          if (prepositional.object) add(phraseTokens(prepositional.object), 'complement');
        }
      }
      return out;
    }
  }

  return {
    parse, tokenize, splitUtterances, xray, phonoCheck, suggest, editDistance, describe, roleLabel,
    lookup, phraseText, canonical, sameMeaning, lexicon: LEX,
  };
})(TOKIPONA_DATA);

  const app = document.getElementById('app');

  const blank = {
    xp: 0, streak: 0, lastDay: null, dayXp: 0, done: {}, mastery: {}, seenWords: {}, srs: {},

  // Lernschritte wie in bewährten Karteikartensystemen: erst zehn Minuten,
  // dann Tage. Der kurze erste Schritt macht die Wiederholung schon in der
  // ersten Sitzung sichtbar, statt sie auf morgen zu vertagen.
  const MINUTE = 60000;
  const DAY = 86400000;
  const STEPS = [10 * MINUTE, DAY, 3 * DAY, 7 * DAY];

  // Übersetzung nachschlagen; fehlt ein Eintrag, greift Deutsch.
  const t = (key, ...args) => {
    const table = T[state.lang] || T.de;
    const value = table[key] !== undefined ? table[key] : T.de[key];
    return typeof value === 'function' ? value(...args) : value;
  };

  const lessons = () => (DATA.languages[state.lang] || DATA.languages.de).lessons;
  const glossesOf = (word) => {
    const entry = TP.lexicon[word];
    if (!entry) return [];
    return entry.glosses[state.lang] || entry.glosses.de;
  };
  const conceptLabel = (id) => (CONCEPT_LABELS[state.lang] || CONCEPT_LABELS.de)[id] || id;
  const say = (violation) => TP.describe(violation, state.lang);

  // Nicht jedes Wort hat in der Schrift ein Zeichen — die 2020er Fassung kennt
  // mehrere nimi ku suli noch nicht. Fällt die Ligatur aus, stünde das
  // lateinische Wort in Zeichengröße da. Also einmal messen statt raten:
  // ein echtes Zeichen ist etwa quadratisch, ein ausgeschriebenes Wort viel breiter.
  let GLYPHS = {};
  const hasGlyph = (word) => Boolean(GLYPHS[word]);

  async function probeGlyphs() {
    if (!document.fonts || !document.fonts.ready) return;
    await document.fonts.ready;
    const probe = document.createElement('span');
    probe.style.cssText = 'position:absolute;visibility:hidden;white-space:pre;'
      + "font-size:40px;font-family:'linja pimeja'";
    document.body.append(probe);
    const found = {};
    for (const word of Object.keys(TP.lexicon)) {
      probe.textContent = word;
      found[word] = probe.getBoundingClientRect().width <= 64;
    }
    probe.remove();
    GLYPHS = found;
    render();
  }

  let state = load();
  let session = null;
  let tab = 'pfad';

  function load() {
    try {
      const stored = JSON.parse(localStorage.getItem(KEY));
      return stored ? Object.assign({}, blank, stored) : Object.assign({}, blank);
    } catch (error) {
      return Object.assign({}, blank);
    }
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (error) { /* egal */ }
  }

  function level() { return Math.floor(state.xp / 100) + 1; }
  function levelProgress() { return state.xp % 100; }

  function award(points) {
    const day = today();
    if (state.lastDay !== day) {
      // Schongang: ein verpasster Tag kostet einen Punkt, nicht die ganze Serie.
      const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
      state.streak = state.lastDay === yesterday ? state.streak + 1 : Math.max(1, state.streak - 1);
      state.lastDay = day;
      state.dayXp = 0;
    }
    state.xp += points;
    state.dayXp += points;
    save();
  }

  function schedule(key, correct) {
    const now = Date.now();
    const card = state.srs[key] || { reps: 0, interval: 0, ease: 2.5, due: now };
    if (correct) {
      card.reps += 1;
      if (card.reps <= STEPS.length) card.interval = STEPS[card.reps - 1];
      else card.interval = Math.round(card.interval * card.ease);
      card.ease = Math.min(2.8, card.ease + 0.05);
    } else {
      card.reps = 0;
      card.interval = STEPS[0];
      card.ease = Math.max(1.4, card.ease - 0.2);
    }
    card.due = now + card.interval;
    state.srs[key] = card;
  }

  const dueKeys = () => {
    const now = Date.now();
    return Object.keys(state.srs).filter((key) => state.srs[key].due <= now);
  };

  function taskFromKey(key) {
    const [kind, rest] = [key.slice(0, 1), key.slice(2)];
    if (kind === 'w') {
      const lesson = lessons().find((l) => l.words.includes(rest)) || lessons()[0];
      return TP.lexicon[rest] ? { type: 'word', word: rest, lesson, concepts: [] } : null;
    }
    if (kind === 'g') {
      const lesson = lessons().find((l) => l.words.includes(rest)) || lessons()[0];
      return TP.lexicon[rest] && hasGlyph(rest)
        ? { type: 'glyph', word: rest, lesson, concepts: [] } : null;
    }
    if (kind === 'q') {
      const prompt = OPEN.prompts.find((entry) => entry.id === rest);
      return prompt ? { type: 'answer', prompt, lesson: lessonOf(prompt.stage) || lessons()[0],
                        concepts: [] } : null;
    }
    if (kind === 'c') {
      const compound = COMPOUNDS[Number(rest)];
      return compound ? { type: 'compound', compound, lesson: lessons()[0], concepts: [] } : null;
    }
    for (const lesson of lessons().concat([musiLesson()])) {
      const item = lesson.items.find((i) => i.id === rest);
      if (item) {
        return { type: item.direction === 'de_tp' ? 'build' : 'choose', item, lesson,
                 concepts: lessonConcepts(lesson) };
      }
    }
    return null;
  }

  function keyOf(task) {
    if (task.type === 'answer') return 'q:' + task.prompt.id;
    if (task.type === 'glyph') return 'g:' + task.word;
    if (task.type === 'word') return 'w:' + task.word;
    if (task.type === 'compound') return 'c:' + COMPOUNDS.indexOf(task.compound);
    if (task.item) return 's:' + task.item.id;
    return null;
  }

  function bumpMastery(concepts, correct) {
    for (const concept of concepts || []) {
      const value = state.mastery[concept] || 0;
      state.mastery[concept] = Math.max(0, Math.min(1, value + (correct ? 0.12 : -0.08)));
    }
  }

  const lessonOf = (number) => lessons().find((l) => l.number === number);
  const unlocked = (number) => number === lessons()[0].number
    || Boolean(state.done[lessons()[lessons().findIndex((l) => l.number === number) - 1].number]);

  // ------------------------------------------------------------ Aussprache

  // toki pona wird gesprochen, wie es dasteht: fünf Vokale, keine Dehnung,
  // Betonung auf der ersten Silbe. Am nächsten kommt eine italienische Stimme,
  // danach eine spanische — beide sprechen die Vokale sauber und kurz.
  const VOICE_ORDER = ['it-it', 'it', 'es-es', 'es', 'pt-br', 'fi-fi', 'sw'];
  let voice = null;

  const speechAvailable = () => typeof window !== 'undefined'
    && 'speechSynthesis' in window && typeof window.SpeechSynthesisUtterance === 'function';

  function pickVoice() {
    if (!speechAvailable()) return null;
    let voices = [];
    try { voices = window.speechSynthesis.getVoices() || []; } catch (error) { return null; }
    const tag = (entry) => String(entry.lang || '').toLowerCase().replace('_', '-');
    for (const wanted of VOICE_ORDER) {
      const found = voices.find((entry) => tag(entry).startsWith(wanted));
      if (found) return found;
    }
    return voices[0] || null;
  }

  function speak(text) {
    if (!speechAvailable()) return false;
    voice = voice || pickVoice();
    const clean = String(text).replace(/[.!?:]/g, ' ').replace(/\s+/g, ' ').trim();
    if (!clean) return false;
    const utterance = new window.SpeechSynthesisUtterance(clean);
    if (voice) { utterance.voice = voice; utterance.lang = voice.lang; }
    else utterance.lang = 'it-IT';
    utterance.rate = 0.85;              // langsam genug zum Mitlesen
    try {
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utterance);
    } catch (error) { return false; }
    return true;
  }

  // Stimmen kommen in manchen Browsern erst nach einem Augenblick.
  if (speechAvailable() && window.speechSynthesis.addEventListener) {
    window.speechSynthesis.addEventListener('voiceschanged', () => {
      const found = pickVoice();
      if (found && !voice) { voice = found; if (!session) render(); }
    });
  }

  // Hörknopf an einem Satz oder Wort. Ohne Sprachausgabe gibt es ihn nicht.
  function sayButton(text, label) {
    if (!state.sound || !speechAvailable()) return null;
    const button = el(`<button class="say" type="button"
      aria-label="${escape(label || t('listen'))}" title="${escape(label || t('listen'))}">♪</button>`);
    button.onclick = (event) => { event.stopPropagation(); speak(text); };
    return button;
  }

  const withSay = (node, text) => {
    const button = sayButton(text);
    if (button) node.append(button);
    return node;
  };

  // ------------------------------------------------------------ Aufgabenbau

  const shuffle = (list) => {
    const out = list.slice();
    for (let i = out.length - 1; i > 0; i -= 1) {
      const j = Math.floor(Math.random() * (i + 1));
      [out[i], out[j]] = [out[j], out[i]];
    }
    return out;
  };

  function buildSession(lesson) {
    const builds = shuffle(lesson.items.filter((i) => i.direction === 'de_tp'));
    const reads = shuffle(lesson.items.filter((i) => i.direction === 'tp_de'));
    const words = shuffle(lesson.words.filter((w) => TP.lexicon[w]));
    const tasks = [];

    words.slice(0, 2).forEach((word) => tasks.push({ type: 'word', word, lesson, concepts: [] }));
    builds.slice(0, 3).forEach((item) =>
      tasks.push({ type: 'build', item, lesson, concepts: lessonConcepts(lesson) }));
    reads.slice(0, 2).forEach((item) =>
      tasks.push({ type: 'choose', item, lesson, concepts: lessonConcepts(lesson) }));

    const flawed = brokenSentence(lesson);
    if (flawed) tasks.push({ type: 'fix', flawed, lesson, concepts: [flawed.violation.concept].filter(Boolean) });

    const compound = availableCompounds(lesson)[0];
    if (compound) tasks.push({ type: 'compound', compound, lesson, concepts: [] });

    const glyphWord = words.find(hasGlyph);
    if (state.sitelen && glyphWord) {
      tasks.push({ type: 'glyph', word: glyphWord, lesson, concepts: [] });
    }

    const heard = reads[2] || builds[4];
    if (state.sound && speechAvailable() && heard) {
      tasks.push({ type: 'listen', item: heard, lesson, concepts: lessonConcepts(lesson) });
    }

    // Eine offene Frage ersetzt das freie Übersetzen: beides ist Tippen, aber
    // die eigene Antwort ist die interessantere Übung.
    const prompt = shuffle(OPEN.prompts.filter((entry) => entry.stage <= lesson.number))[0];
    if (prompt) tasks.push({ type: 'answer', prompt, lesson, concepts: lessonConcepts(lesson) });
    else if (builds[3]) {
      tasks.push({ type: 'free', item: builds[3], lesson, concepts: lessonConcepts(lesson) });
    }

    return {
      lesson,
      queue: tasks.length ? tasks : builds.slice(0, 4).map((item) => ({ type: 'build', item, lesson, concepts: [] })),
      index: 0,
      correct: 0,
      total: 0,
      xp: 0,
      retried: new Set(),
    };
  }

  // Der Spaßmodus sieht für die Übungsmaschine aus wie eine Lektion — Nummer
  // 99, damit die Ablenkungswörter aus dem ganzen Kurs kommen dürfen.
  let musiCache = null;
  function musiLesson() {
    if (musiCache && musiCache.lang === state.lang) return musiCache.lesson;
    const lesson = {
      number: 99,
      musi: true,
      title: t('musiTitle'),
      note: '',
      words: [...new Set(MUSI.lines
        .flatMap((line) => TP.tokenize(line.tp).map((token) => token.text))
        .filter((word) => TP.lexicon[word]))],
      items: MUSI.lines.map((line) => ({
        id: line.id,
        direction: 'tp_de',
        tp: line.tp,
        also: [],
        target: line[state.lang] || line.de,
        kind: line.kind,
        sting: line.sting,
        lit: line.lit[state.lang] || line.lit.de,
      })),
    };
    musiCache = { lang: state.lang, lesson };
    return lesson;
  }

  function buildMusiSession() {
    const lesson = musiLesson();
    // Aus jeder Sorte etwas, damit die Runde nicht nur aus Sticheleien besteht.
    const bySort = ['utala', 'utala', 'konter', 'wawa', 'pona'].map((kind) =>
      shuffle(lesson.items.filter((item) => item.kind === kind))[0]).filter(Boolean);
    const picks = [...new Set(bySort.concat(shuffle(lesson.items)))].slice(0, 6);
    const tasks = shuffle(picks).map((item, index) => ({
      type: index % 2 ? 'build' : 'choose', item, lesson, concepts: [],
    }));
    const flawed = brokenSentence(lesson);
    if (flawed) {
      tasks.splice(Math.min(3, tasks.length), 0,
        { type: 'fix', flawed, lesson, concepts: [flawed.violation.concept].filter(Boolean) });
    }
    return { lesson, musi: true, queue: tasks, index: 0, correct: 0, total: 0, xp: 0,
             retried: new Set() };
  }

  function buildReviewSession() {
    const tasks = shuffle(dueKeys()).map(taskFromKey).filter(Boolean).slice(0, 12);
    return {
      lesson: null, review: true, queue: tasks, index: 0, correct: 0, total: 0, xp: 0,
      retried: new Set(),
    };
  }

  // Umschreibungen, deren Wörter die Lernende schon kennt.
  function availableCompounds(lesson) {
    const known = new Set(lessons().filter((l) => l.number <= lesson.number).flatMap((l) => l.words));
    return shuffle(COMPOUNDS.filter((compound) =>
      TP.tokenize(compound.tp).every((token) => token.text === 'pi' || known.has(token.text))));
  }

  // Fehlersätze entstehen aus richtigen: eine Regel gezielt verletzen und vom
  // Parser bestätigen lassen, dass genau sie anschlägt. Kein Handbetrieb.
  const MUTATIONS = [
    { rule: 'liAfterMiSina', apply: (words) =>
        (['mi', 'sina'].includes(words[0]) && words[1] !== 'li' ? [words[0], 'li', ...words.slice(1)] : null) },
    { rule: 'missingLi', apply: (words) =>
        (words.includes('li') && words.includes('e') && !['mi', 'sina'].includes(words[0])
          ? words.filter((w, i) => i !== words.indexOf('li')) : null) },
    { rule: 'piWithSingleWord', apply: (words) =>
        (words.length > 2 && !words.includes('pi') && !TP.lexicon[words[1]]?.roles.includes('particle')
          ? [words[0], 'pi', ...words.slice(1)] : null) },
  ];

  function brokenSentence(lesson) {
    for (const item of shuffle(lesson.items)) {
      const words = TP.tokenize(item.tp).map((t) => t.text);
      for (const mutation of shuffle(MUTATIONS)) {
        const broken = mutation.apply(words);
        if (!broken) continue;
        const result = TP.parse(broken.join(' ') + '.');
        if (result.violations.length !== 1) continue;
        if (result.violations[0].rule !== mutation.rule) continue;
        return { words: broken, correct: item.tp, violation: result.violations[0] };
      }
    }
    return null;
  }

  function lessonConcepts(lesson) {
    const map = {
      1: ['c_mi_sina', 'c_li'], 2: ['c_modifikator'], 3: ['c_e_objekt'], 4: ['c_e_objekt'],
      5: ['c_ni', 'c_en'], 6: ['c_praeposition'], 7: ['c_frage', 'c_o', 'c_namen'],
      8: ['c_modifikator'], 9: ['c_pi', 'c_la'], 10: ['c_praeverb'], 11: ['c_zahlen'], 12: [],
    };
    return map[lesson.number] || [];
  }

  function distractorWords(lesson, exclude, count) {
    const pool = lessons()
      .filter((l) => l.number <= lesson.number)
      .flatMap((l) => l.words)
      .filter((w) => !exclude.includes(w) && TP.lexicon[w]);
    return shuffle([...new Set(pool)]).slice(0, count);
  }

  // ------------------------------------------------------------ Darstellung

  const el = (html) => {
    const template = document.createElement('template');
    template.innerHTML = html.trim();
    return template.content.firstElementChild;
  };
  const escape = (text) => String(text).replace(/[&<>"]/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // Beim Austausch des Baums kann Safari den Fokus auf ein frisches Element
  // legen. Der Fokusring sieht aus wie eine getroffene Auswahl — auf einem
  // Bildschirm, den noch niemand berührt hat, gehört er nirgendwo hin.
  function clearStrayFocus() {
    const active = document.activeElement;
    if (active && active !== document.body && app.contains(active) && active.blur) {
      active.blur();
    }
  }

  function render() {
    hideGloss();
    app.innerHTML = '';
    if (session) { renderSession(); clearStrayFocus(); return; }
    app.append(topbar());
    if (tab === 'pfad') app.append(pathScreen());
    else if (tab === 'nimi') app.append(wordScreen());
    else if (tab === 'musi') app.append(musiScreen());
    else app.append(sandboxScreen());
    app.append(tabs());
    clearStrayFocus();
  }

          <div class="concept">

    return screen;

  function languageCard() {

  function sitelenCard() {

      <div class="card">
        <h2>sitelen pona</h2>

        <div class="row"><button class="ghost"></button></div>
      </div>`);

    const button = card.querySelector('.ghost');
    const label = () => { button.textContent = t(state.sitelen ? 'sitelenOff' : 'sitelenOn'); };

  // ------------------------------------------------------------ Wortnachschlag

  // Auf dem Telefon gibt es kein Hover — dort ist Antippen die Geste. Am
  // Zeigegerät kommt Überfahren dazu.
  let bubble = null;

  function hideGloss() {
    if (bubble) { bubble.remove(); bubble = null; }
  }

  function showGloss(anchor, word) {
    const list = glossesOf(word);
    if (!list.length) return;
    hideGloss();
    const entry = TP.lexicon[word];
    bubble = el(`
      <div class="bubble" role="status">
        ${hasGlyph(word) ? `<span class="sp bubble-glyph">${escape(word)}</span>` : ''}
        <span class="bubble-body">
          <b>${escape(word)}</b>
          <span>${escape(list.join(', '))}</span>
        </span>
        <em>${entry.book === 'pu' ? 'pu' : 'ku'}</em>
      </div>`);
    app.append(bubble);

    // Unter dem Wort, aber innerhalb des Fensters gehalten.
    const target = anchor.getBoundingClientRect();
    const frame = app.getBoundingClientRect();
    const box = bubble.getBoundingClientRect();
    const left = Math.max(8, Math.min(
      target.left + target.width / 2 - box.width / 2 - frame.left,
      frame.width - box.width - 8,
    ));
    bubble.style.left = `${left}px`;
    bubble.style.top = `${target.bottom - frame.top + 6}px`;
  }

  // Ein Tipp irgendwo sonst schließt die Blase wieder.
  document.addEventListener('pointerdown', (event) => {
    if (!bubble) return;
    if (event.target.closest && event.target.closest('.gloss-word')) return;
    hideGloss();
  }, true);

  const canHover = () => window.matchMedia && window.matchMedia('(hover: hover)').matches;

  // Satz mit nachschlagbaren Wörtern. Satzzeichen und Namen bleiben stehen,
  // nur bekannte Wörter werden anfassbar.
  function glossed(text, className) {
    const wrap = el(`<span class="${className}"></span>`);
    for (const part of String(text).split(/(\s+)/)) {
      if (!part) continue;
      if (/^\s+$/.test(part)) { wrap.append(document.createTextNode(part)); continue; }
      const bare = part.toLowerCase().replace(/[^a-z]/g, '');
      const entry = bare && (TP.lexicon[bare] || TP.lexicon[DATA.variants[bare]]);
      if (!entry) { wrap.append(document.createTextNode(part)); continue; }
      const key = TP.lexicon[bare] ? bare : DATA.variants[bare];
      const word = el(`<button class="gloss-word" type="button">${escape(part)}</button>`);
      word.onclick = (event) => {
        event.stopPropagation();
        if (bubble && bubble.dataset.word === key) { hideGloss(); return; }
        showGloss(word, key);
        if (bubble) bubble.dataset.word = key;
      };
      if (canHover()) {
        word.onmouseenter = () => { showGloss(word, key); if (bubble) bubble.dataset.word = key; };
        word.onmouseleave = hideGloss;
      }
      wrap.append(word);
    }
    return wrap;
  }

  // ------------------------------------------------------------ Sicherung

  const stamp = () => new Date().toISOString().slice(0, 10);

  function backupText() {
    return JSON.stringify({ app: 'o toki!', version: 1, exported: new Date().toISOString(), state });
  }

  // Nimmt sowohl eine Sicherungsdatei als auch einen rohen Zustand an.
  function readBackup(text) {
    let payload;
    try {
      payload = JSON.parse(text.trim());
    } catch (error) {
      throw new Error(t('backupUnreadable'));
    }
    const found = payload && payload.state ? payload.state : payload;
    if (!found || typeof found !== 'object' || ['xp', 'done', 'srs'].some((f) => !(f in found))) {
      throw new Error(t('backupForeign'));
    }
    return {
      state: Object.assign({}, blank, found),
      exported: payload && payload.exported ? payload.exported.slice(0, 10) : null,
    };
  }

  const summarise = (value) => t('summary', Math.floor((value.xp || 0) / 100) + 1,
    Object.keys(value.done || {}).length, Object.keys(value.srs || {}).length, value.xp || 0);

  function backupCard() {
    const card = el(`
      <div class="card">
        <h2>${escape(t('backupTitle'))}</h2>
        <p class="hint">${escape(t('backupState', summarise(state)))}</p>
        <div class="row">
          <button class="ghost" data-do="save">${escape(t('backupSave'))}</button>
          <button class="ghost" data-do="load">${escape(t('backupLoad'))}</button>
        </div>
        <div class="drawer"></div>
      </div>`);

    const drawer = card.querySelector('.drawer');
    const note = (text, bad) => {
      const line = el(`<p class="hint ${bad ? 'bad' : 'good'}">${escape(text)}</p>`);
      drawer.append(line);
    };

    card.querySelector('[data-do="save"]').onclick = async () => {
      drawer.innerHTML = '';
      const text = backupText();
      const name = `o-toki-fortschritt-${stamp()}.json`;

      const share = el(`<button class="ghost">${escape(t('backupFile'))}</button>`);
      share.onclick = async () => {
        const file = new File([text], name, { type: 'application/json' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({ files: [file], title: 'o toki! — Fortschritt' });
            return;
          } catch (error) { /* abgebrochen: dann eben herunterladen */ }
        }
        const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
        const link = document.createElement('a');
        link.href = url;
        link.download = name;
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      };

      const copy = el(`<button class="ghost">${escape(t('backupCopy'))}</button>`);
      copy.onclick = async () => {
        try {
          await navigator.clipboard.writeText(text);
          note(t('backupCopied'));
        } catch (error) {
          note(t('backupCopyFailed'), true);
        }
      };

      drawer.append(share, copy);
    };

    card.querySelector('[data-do="load"]').onclick = () => {
      drawer.innerHTML = '';
      const form = el(`
        <div>
          <label class="ghost pickwrap">${escape(t('backupPick'))}
            <input class="pick" type="file" accept="application/json,.json,text/plain">
          </label>
          <textarea class="paste" rows="3" placeholder="${escape(t('backupPaste'))}"
            aria-label="${escape(t('backupPaste'))}"></textarea>
          <div class="preview"></div>
        </div>`);
      const preview = form.querySelector('.preview');

      const offer = (text) => {
        preview.innerHTML = '';
        let backup;
        try {
          backup = readBackup(text);
        } catch (error) {
          preview.append(el(`<p class="hint bad">${escape(error.message)}</p>`));
          return;
        }
        preview.append(el(`<p class="hint">${t('backupFound', escape(summarise(backup.state)),
          backup.exported ? escape(backup.exported) : null, escape(summarise(state)))}</p>`));
        const confirm = el(`<button class="primary">${escape(t('backupApply'))}</button>`);
        confirm.onclick = () => {
          state = backup.state;
          save();
          tab = 'pfad';
          render();
        };
        preview.append(confirm);
      };

      form.querySelector('.paste').oninput = (event) => {
        if (event.target.value.trim()) offer(event.target.value);
        else preview.innerHTML = '';
      };
      form.querySelector('.pick').onchange = (event) => {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => offer(String(reader.result));
        reader.onerror = () => preview.append(el(`<p class="hint bad">${escape(t('backupUnreadableFile'))}</p>`));
        reader.readAsText(file);
      };

      drawer.append(form);
    };

    return card;
  }

  // ------------------------------------------------------------ Übungslauf

  function renderSession() {
    if (session.index >= session.queue.length) { renderDone(); return; }
    const task = session.queue[session.index];

    const head = el(`
      <div class="exbar">
        <button aria-label="Abbrechen">✕</button>
        <span class="track"><i style="width:${(session.index / session.queue.length) * 100}%"></i></span>
        <span class="metric">✓ <b>${session.correct}</b></span>
      </div>`);
    head.querySelector('button').onclick = () => { session = null; render(); };
    app.append(head);

    if (task.type === 'word') app.append(wordTask(task));
    else if (task.type === 'build') app.append(buildTask(task));
    else if (task.type === 'choose') app.append(chooseTask(task));
    else if (task.type === 'fix') app.append(fixTask(task));
    else if (task.type === 'compound') app.append(compoundTask(task));
    else if (task.type === 'glyph') app.append(glyphTask(task));
    else if (task.type === 'listen') app.append(listenTask(task));
    else if (task.type === 'answer') app.append(answerTask(task));
    else app.append(freeTask(task));
  }

  function screenWith(inner) {
    return el(`<div class="screen">${inner}</div>`);
  }

  function wordTask(task) {
    const entry = TP.lexicon[task.word];
    const right = glossesOf(task.word).slice(0, 3).join(', ');
    const options = shuffle([right, ...distractorWords(task.lesson, [task.word], 3)
      .map((w) => (TP.lexicon[w].glosses[state.lang] || TP.lexicon[w].glosses.de).slice(0, 3).join(', '))]);

    const screen = screenWith(`
      <p class="prompt">${escape(t('askWord'))}</p>
      <h2 class="question tp">${escape(task.word)}</h2>
      <div class="choices"></div>
      <div class="actions"><button class="primary" disabled>${escape(t('check'))}</button></div>`);

    withSay(screen.querySelector('.question'), task.word);

    let picked = null;
    const list = screen.querySelector('.choices');
    const button = screen.querySelector('.primary');
    options.forEach((option) => {
      const choice = el(`<button class="choice">${escape(option)}</button>`);
      choice.onclick = () => {
        picked = option;
        list.querySelectorAll('.choice').forEach((c) => { c.dataset.picked = 'false'; });
        choice.dataset.picked = 'true';
        button.disabled = false;
      };
      list.append(choice);
    });

    button.onclick = () => {
      state.seenWords[task.word] = true;
      finish(task, picked === right, {
        solution: `${task.word} — ${right}`,
        speak: task.word,
        xray: null,                     // eine Wortbedeutung hat keinen Satzbau
        reason: picked === right ? null
          : t('covers', escape(task.word), escape(glossesOf(task.word).join(', '))),
      });
    };
    return screen;
  }

  function buildTask(task) {
    const solution = TP.tokenize(task.item.tp).map((t) => t.text);
    const extras = distractorWords(task.lesson, solution, Math.min(3, Math.max(2, 6 - solution.length)));
    // Jede Kachel bekommt eine eigene Nummer. Kommt „li“ dreimal vor, sind das
    // drei unterscheidbare Kacheln — sonst greift ein Tipp auf die falsche.
    const bank = shuffle(solution.concat(extras)).map((word, index) => ({ word, id: String(index) }));
    const wordOf = new Map(bank.map((chip) => [chip.id, chip.word]));

    const screen = screenWith(`
      <p class="prompt">${escape(t('askBuild'))}</p>
      <h2 class="question">${escape(task.item.target[0])}</h2>
      <div class="slot"></div>
      <p class="hint">${escape(t('hintBuild'))}</p>
      <div class="bank"></div>
      <div class="actions"><button class="primary" disabled>${escape(t('check'))}</button></div>`);

    const slot = screen.querySelector('.slot');
    const bankRow = screen.querySelector('.bank');
    const button = screen.querySelector('.primary');
    const chosen = [];

    // Die gelegten Kacheln sind die Wahrheit: nach jedem Ziehen wird die
    // Wortfolge aus der Reihenfolge im Baum neu gelesen.
    const readOrder = () => Array.from(slot.children).map((node) => node.dataset.id);

    const refreshBank = () => {
      bankRow.querySelectorAll('.tile').forEach((tile) => {
        // Belegt ist genau die Kachel, die oben liegt — nicht irgendeine mit
        // demselben Wort.
        tile.classList.toggle('used', chosen.includes(tile.dataset.id));
      });
      button.disabled = chosen.length === 0;
    };

    const commit = () => {
      chosen.length = 0;
      chosen.push(...readOrder());
      refreshBank();
    };

    const remove = (node) => {
      node.remove();
      commit();
    };

    // Ziehen über Pointer-Events; HTML5-Drag gibt es auf iOS nicht.
    // Unter der Schwelle bleibt es ein Tipp und entfernt die Kachel.
    const THRESHOLD = 8;

    function grab(node, event) {
      if (event.button !== undefined && event.button !== 0) return;
      // Am Fenster lauschen, nicht an der Kachel: Das Umhängen im Baum löst
      // eine Pointer-Erfassung wieder, und danach käme kein pointerup mehr an.
      const pointerId = event.pointerId;
      const startX = event.clientX;
      const startY = event.clientY;
      const box = node.getBoundingClientRect();
      const holdX = startX - box.left;
      const holdY = startY - box.top;
      let dragging = false;

      const follow = (move) => {
        if (move.pointerId !== pointerId) return;
        if (!dragging) {
          if (Math.hypot(move.clientX - startX, move.clientY - startY) < THRESHOLD) return;
          dragging = true;
          node.classList.add('dragging');
        }

        node.style.transform = '';
        const base = node.getBoundingClientRect();
        node.style.transform = `translate(${move.clientX - holdX - base.left}px, `
          + `${move.clientY - holdY - base.top}px)`;

        // Nächste Nachbarkachel suchen; Zeilen zählen stärker als Spalten,
        // damit der Umbruch nicht gegen die Absicht arbeitet.
        let closest = null;
        let best = Infinity;
        let after = false;
        for (const other of slot.children) {
          if (other === node) continue;
          const rect = other.getBoundingClientRect();
          const cx = rect.left + rect.width / 2;
          const cy = rect.top + rect.height / 2;
          const distance = Math.hypot(move.clientX - cx, (move.clientY - cy) * 2.5);
          if (distance < best) {
            best = distance;
            closest = other;
            after = move.clientX > cx;
          }
        }
        if (closest) slot.insertBefore(node, after ? closest.nextSibling : closest);
      };

      const release = (up) => {
        if (up && up.pointerId !== pointerId) return;
        window.removeEventListener('pointermove', follow);
        window.removeEventListener('pointerup', release);
        window.removeEventListener('pointercancel', release);
        node.style.transform = '';
        node.classList.remove('dragging');
        if (dragging) commit();
        else remove(node);
      };

      window.addEventListener('pointermove', follow);
      window.addEventListener('pointerup', release);
      window.addEventListener('pointercancel', release);
    }

    // Ohne Zeigegerät bedienbar: mit den Pfeiltasten verschieben.
    function shift(node, direction) {
      const sibling = direction < 0 ? node.previousElementSibling : node.nextElementSibling;
      if (!sibling) return;
      slot.insertBefore(direction < 0 ? node : sibling, direction < 0 ? sibling : node);
      commit();
      node.focus();
    }

    const place = (id) => {
      const word = wordOf.get(id);
      const tile = el(`<button class="tile placed" data-word="${escape(word)}" data-id="${escape(id)}"
        aria-label="${escape(word)} — antippen entfernt, ziehen oder Pfeiltasten sortieren um"
        >${escape(word)}</button>`);
      tile.addEventListener('pointerdown', (event) => grab(tile, event));
      tile.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowLeft') { event.preventDefault(); shift(tile, -1); }
        else if (event.key === 'ArrowRight') { event.preventDefault(); shift(tile, 1); }
        else if (event.key === 'Backspace' || event.key === 'Delete') {
          event.preventDefault();
          remove(tile);
        }
      });
      slot.append(tile);
    };

    const sync = () => {
      slot.innerHTML = '';
      chosen.forEach(place);
      refreshBank();
    };

    bank.forEach(({ word, id }) => {
      const tile = el(`<button class="tile" data-word="${escape(word)}" data-id="${escape(id)}"
        >${escape(word)}</button>`);
      tile.onclick = () => {
        if (chosen.includes(id)) return;
        chosen.push(id);
        sync();
      };
      bankRow.append(tile);
    });
    sync();

    button.onclick = () => {
      const answer = chosen.map((id) => wordOf.get(id)).join(' ');
      const verdict = grade(answer, task.item);
      // Beim Bauen zählt die Musterlösung oder eine reine Umstellung der
      // Beifügungen. Dieselben Wörter in anderer Rolle sagen etwas anderes —
      // dafür gibt es keinen Punkt, aber eine Erklärung.
      const correct = Boolean(verdict.exact || verdict.order);
      finish(task, correct, {
        solution: task.item.tp,
        speak: task.item.tp,
        xray: answer || task.item.tp,
        grade: verdict.exact ? null : verdict,
      });
    };
    return screen;
  }
